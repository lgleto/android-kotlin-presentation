</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="128" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="128" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="fun%C3%A7%C3%B5es-de-ordem-superior">Funções de ordem superior</h1>
<p>Uma função de ordem superior recebe ou devolve outra função.</p>
<p><code>CalculatorButton</code> não sabe o que acontece ao carregar — só <strong>invoca</strong> o callback:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">CalculatorButton</span><span class="hljs-params">(
    label: <span class="hljs-type">String</span>,
    isOperation: <span class="hljs-type">Boolean</span> = <span class="hljs-literal">false</span>,
    onNumPressed: (<span class="hljs-type">String</span>) -&gt; <span class="hljs-type">Unit</span>    <span class="hljs-comment">// função recebida como parâmetro</span>
)</span></span> {
    Button(onClick = { onNumPressed(label) }) {
        Text(label)
    }
}
</code></pre>
<p><code>(String) -&gt; Unit</code> é um <strong>tipo função</strong> — &quot;recebe String, não devolve nada&quot;.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="129" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="129" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="lambdas--calculatorview">Lambdas — CalculatorView</h1>
<p>Em <code>CalculatorView</code>, o comportamento é definido com <strong>lambdas</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">val</span> onDigitPressed: (String) -&gt; <span class="hljs-built_in">Unit</span> = { digit -&gt;
    <span class="hljs-keyword">if</span> (userIsTypingNumber) {
        displayText = <span class="hljs-keyword">if</span> (displayText == <span class="hljs-string">&quot;0&quot;</span>) digit <span class="hljs-keyword">else</span> displayText + digit
    } <span class="hljs-keyword">else</span> {
        displayText = <span class="hljs-keyword">if</span> (digit == <span class="hljs-string">&quot;.&quot;</span>) <span class="hljs-string">&quot;0.&quot;</span> <span class="hljs-keyword">else</span> digit
    }
    userIsTypingNumber = <span class="hljs-literal">true</span>
}

<span class="hljs-keyword">val</span> onOperationPressed: (String) -&gt; <span class="hljs-built_in">Unit</span> = { op -&gt;
    calculatorBrain.unaryOperation(
        displayText.toDouble(),
        CalculatorBrain.Operation.parseOperation(op)
    )
    displayText = calculatorBrain.operand.toString()
    userIsTypingNumber = <span class="hljs-literal">false</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="130" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="130" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="passar-comportamento-%C3%A0-ui">Passar comportamento à UI</h1>
<p>Cada botão recebe a lambda adequada — <strong>sem</strong> <code>if</code>/<code>when</code> no componente:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">CalculatorButton(label = <span class="hljs-string">&quot;7&quot;</span>, onNumPressed = onDigitPressed)
CalculatorButton(label = <span class="hljs-string">&quot;8&quot;</span>, onNumPressed = onDigitPressed)
CalculatorButton(label = <span class="hljs-string">&quot;+&quot;</span>, onNumPressed = onOperationPressed, isOperation = <span class="hljs-literal">true</span>)
CalculatorButton(label = <span class="hljs-string">&quot;=&quot;</span>, onNumPressed = onOperationPressed, isOperation = <span class="hljs-literal">true</span>)
</code></pre>
<p>O mesmo <code>CalculatorButton</code> serve para dígitos e operações — só muda a função passada.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="131" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="131" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="programa%C3%A7%C3%A3o-funcional--resumo">Programação Funcional — resumo</h1>
<table>

<tbody>
<tr>
<td>Função como valor</td>

</tr>
<tr>
<td>Função pura</td>
<td><code>add(a, b) = a + b</code></td>
</tr>
<tr>
<td>Ordem superior</td>
<td><code>CalculatorButton(..., onNumPressed = ...)</code></td>
</tr>
<tr>
<td>Mapa de funções</td>
<td><code>binaryOperations[op]?.invoke(a, b)</code></td>
</tr>
<tr>
<td>Imutabilidade</td>
<td><code>val</code> para lambdas; estado em <code>remember</code></td>
</tr>
</tbody>
</table>
<p>Kotlin e Compose incentivam este estilo — veremos mais em <strong>Jetpack Compose</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="132" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="132" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="jetpack-compose">Jetpack Compose</h1>
<ul>
<li>UI <strong>declarativa</strong> — descrevemos o que queremos ver, não como desenhar pixel a pixel</li>
<li>Substituto moderno das <strong>Views XML</strong> + <code>findViewById</code></li>
<li>Funções anotadas com <code>@Composable</code> devolvem UI</li>
<li>Recomposição automática quando o <strong>estado</strong> muda</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// XML + View                    // Compose</span>
TextView(<span class="hljs-keyword">this</span>)                   Text(<span class="hljs-string">&quot;Hello&quot;</span>)
LinearLayout                     Column { ... }
setContentView(layout)           setContent { MyScreen() }
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="133" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="133" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="composable">@Composable</h1>
<p>Uma função Composable descreve um pedaço de interface:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">Greeting</span><span class="hljs-params">(name: <span class="hljs-type">String</span>)</span></span> {
    Text(text = <span class="hljs-string">&quot;Hello, <span class="hljs-variable">$name</span>!&quot;</span>)
}
</code></pre>
<p>Regras básicas:</p>
<ul>
<li>Só pode ser chamada de outra função <code>@Composable</code> ou de <code>setContent { }</code></li>
<li>Não devolve <code>View</code> — devolve UI através do compilador Compose</li>
<li>Pode ser chamada várias vezes (recomposição)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="134" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="134" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="mainactivity-com-compose">MainActivity com Compose</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">MainActivity</span> : <span class="hljs-type">ComponentActivity</span>() {
    <span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onCreate</span><span class="hljs-params">(savedInstanceState: <span class="hljs-type">Bundle</span>?)</span></span> {
        <span class="hljs-keyword">super</span>.onCreate(savedInstanceState)
        enableEdgeToEdge()
        setContent {
            CalculatorTheme {
                Scaffold(modifier = Modifier.fillMaxSize()) { innerPadding -&gt;
                    CalculatorView(modifier = Modifier.padding(innerPadding))
                }
            }
        }
    }
}
</code></pre>
<p><code>setContent { }</code> é o ponto de entrada da UI Compose na Activity.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="135" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="135" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="text">Text</h1>
<p>Equivalente ao <code>TextView</code> — mostra texto na interface:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">MyText</span><span class="hljs-params">()</span></span> {
    Text(
        text = <span class="hljs-string">&quot;Hello, Compose!&quot;</span>,
        style = MaterialTheme.typography.displayLarge,
        textAlign = TextAlign.End,
        modifier = Modifier
            .padding(<span class="hljs-number">16.</span>dp)
            .fillMaxWidth()
    )
}
</code></pre>
<p>Propriedades comuns: <code>text</code>, <code>style</code>, <code>color</code>, <code>fontSize</code>, <code>textAlign</code>, <code>modifier</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="136" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="136" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="button">Button</h1>
<p>Equivalente ao <code>Button</code> Android — área clicável com texto:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">MyButton</span><span class="hljs-params">()</span></span> {
    Button(
        onClick = { println(<span class="hljs-string">&quot;Button clicked!&quot;</span>) }
    ) {
        Text(<span class="hljs-string">&quot;Click me&quot;</span>)
    }
}
</code></pre>
<p>O conteúdo do botão (label) é outro Composable — normalmente um <code>Text</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="137" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="137" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="column">Column</h1>
<p>Empilha elementos <strong>verticalmente</strong> (de cima para baixo):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">Column(
    modifier = Modifier.fillMaxSize(),
    horizontalAlignment = Alignment.CenterHorizontally,
    verticalArrangement = Arrangement.Center
) {
    Text(<span class="hljs-string">&quot;Primeira linha&quot;</span>)
    Text(<span class="hljs-string">&quot;Segunda linha&quot;</span>)
    Button(onClick = { }) { Text(<span class="hljs-string">&quot;OK&quot;</span>) }
}
</code></pre>
<p>Equivalente a um <code>LinearLayout</code> com orientação <strong>vertical</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="138" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="138" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="row">Row</h1>
<p>Empilha elementos <strong>horizontalmente</strong> (da esquerda para a direita):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">Row(
    modifier = Modifier.fillMaxWidth(),
    horizontalArrangement = Arrangement.SpaceEvenly,
    verticalAlignment = Alignment.CenterVertically
) {
    Button(onClick = { }) { Text(<span class="hljs-string">&quot;7&quot;</span>) }
    Button(onClick = { }) { Text(<span class="hljs-string">&quot;8&quot;</span>) }
    Button(onClick = { }) { Text(<span class="hljs-string">&quot;9&quot;</span>) }
    Button(onClick = { }) { Text(<span class="hljs-string">&quot;+&quot;</span>) }
}
</code></pre>
<p>Equivalente a um <code>LinearLayout</code> com orientação <strong>horizontal</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="139" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="139" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="box">Box</h1>
<p>Sobrepõe elementos uns sobre os outros — útil para alinhar conteúdo:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">Box(
    modifier = Modifier
        .size(<span class="hljs-number">120.</span>dp)
        .background(Color.LightGray),
    contentAlignment = Alignment.Center
) {
    Text(
        text = <span class="hljs-string">&quot;42&quot;</span>,
        style = MaterialTheme.typography.displayLarge
    )
}
</code></pre>
<p><code>contentAlignment</code> define onde o conteúdo fica dentro da caixa (centro, canto, etc.).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="140" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="140" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="modifier">Modifier</h1>
<p><code>Modifier</code> aplica tamanho, padding, alinhamento e outros efeitos:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">Text(
    text = displayText,
    modifier = Modifier
        .padding(<span class="hljs-number">16.</span>dp)          <span class="hljs-comment">// margem interior</span>
        .fillMaxWidth()          <span class="hljs-comment">// largura total</span>
        .background(Color.Black) <span class="hljs-comment">// fundo (opcional)</span>
)
</code></pre>
<p>Encadeamos modificadores — a <strong>ordem importa</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="141" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="141" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="exemplo--text--button--column">Exemplo — Text + Button + Column</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">HelloScreen</span><span class="hljs-params">()</span></span> {
    <span class="hljs-keyword">var</span> count <span class="hljs-keyword">by</span> remember { mutableStateOf(<span class="hljs-number">0</span>) }

    Column(
        modifier = Modifier.fillMaxSize(),
        horizontalAlignment = Alignment.CenterHorizontally,
        verticalArrangement = Arrangement.Center
    ) {
        Text(
            text = <span class="hljs-string">&quot;Clicaste <span class="hljs-variable">$count</span> vezes&quot;</span>,
            style = MaterialTheme.typography.headlineMedium
        )
        Button(onClick = { count++ }) {
            Text(<span class="hljs-string">&quot;Incrementar&quot;</span>)
        }
    }
}
</code></pre>
<p><code>remember</code> + <code>mutableStateOf</code> guardam estado — ao mudar, a UI <strong>recompõe-se</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="142" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="142" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="exemplo--grelha-com-row-e-column">Exemplo — grelha com Row e Column</h1>
<p>Uma grelha é uma <code>Column</code> de <code>Row</code>s:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">Column(
    modifier = Modifier.fillMaxSize(),
    horizontalAlignment = Alignment.CenterHorizontally
) {
    Text(
        text = displayText,
        modifier = Modifier.padding(<span class="hljs-number">16.</span>dp).fillMaxWidth(),
        textAlign = TextAlign.End,
        style = MaterialTheme.typography.displayLarge
    )
    Row {
        CalculatorButton(label = <span class="hljs-string">&quot;7&quot;</span>, onNumPressed = onDigitPressed)
        CalculatorButton(label = <span class="hljs-string">&quot;8&quot;</span>, onNumPressed = onDigitPressed)
        CalculatorButton(label = <span class="hljs-string">&quot;9&quot;</span>, onNumPressed = onDigitPressed)
        CalculatorButton(label = <span class="hljs-string">&quot;+&quot;</span>, onNumPressed = onOperationPressed, isOperation = <span class="hljs-literal">true</span>)
    }
    Row {
        CalculatorButton(label = <span class="hljs-string">&quot;4&quot;</span>, onNumPressed = onDigitPressed)
        <span class="hljs-comment">// ...</span>
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="143" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="143" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="layouts-compose--resumo">Layouts Compose — resumo</h1>
<table>
<thead>
<tr>
<th>Layout</th>
<th>Orientação</th>
<th>Equivalente XML</th>
<th>Uso típico</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Column</code></td>
<td>vertical ↓</td>
<td><code>LinearLayout</code> vertical</td>
<td>formulários, listas, ecrãs</td>
</tr>
<tr>
<td><code>Row</code></td>
<td>horizontal →</td>
<td><code>LinearLayout</code> horizontal</td>
<td>toolbars, grelhas, botões lado a lado</td>
</tr>
<tr>
<td><code>Box</code></td>
<td>sobreposição</td>
<td><code>FrameLayout</code></td>
<td>badges, texto centrado sobre imagem</td>
</tr>
</tbody>
</table>
<p>Componentes básicos: <code>Text</code> (texto), <code>Button</code> (ação clicável).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="144" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="144" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="preview">Preview</h1>
<p>O Android Studio mostra a UI <strong>sem correr</strong> a app no emulador:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Preview(showBackground = true)</span>
<span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">CalculatorViewPreview</span><span class="hljs-params">()</span></span> {
    CalculatorTheme {
        CalculatorView()
    }
}
</code></pre>
<p>Útil para iterar rapidamente no design dos Composables.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="145" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="145" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="efeitos-secund%C3%A1rios-em-compose">Efeitos secundários em Compose</h1>
<p>Até agora, o estado mudava com <strong>cliques</strong> (<code>onClick</code>). Mas muitas vezes precisamos de:</p>
<ul>
<li>Carregar dados de uma <strong>API</strong> ao abrir o ecrã</li>
<li>Iniciar uma <strong>animação</strong> ou temporizador</li>
<li>Navegar após um <strong>delay</strong></li>
<li>Reagir quando um <strong>parâmetro</strong> muda</li>
</ul>
<p>Estas ações são <strong>efeitos secundários</strong> — não fazem parte da descrição visual da UI.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="146" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="146" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="launchedeffect">LaunchedEffect</h1>
<p><code>LaunchedEffect</code> executa código <strong>suspend</strong> (coroutines) quando o Composable entra em composição:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">UserScreen</span><span class="hljs-params">(userId: <span class="hljs-type">String</span>)</span></span> {
    <span class="hljs-keyword">var</span> userName <span class="hljs-keyword">by</span> remember { mutableStateOf(<span class="hljs-string">&quot;A carregar...&quot;</span>) }

    LaunchedEffect(userId) {
        <span class="hljs-keyword">val</span> user = api.fetchUser(userId)   <span class="hljs-comment">// suspend function</span>
        userName = user.name
    }

    Text(text = userName)
}
</code></pre>
<p>Cancela-se <strong>automaticamente</strong> quando o Composable sai do ecrã.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="147" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="147" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="launchedeffect--quando-usar">LaunchedEffect — quando usar</h1>
<table>
<thead>
<tr>
<th>Situação</th>
<th>Usar</th>
</tr>
</thead>
<tbody>
<tr>
<td>Mostrar UI com base em estado</td>
<td><code>Text</code>, <code>Column</code>, etc.</td>
</tr>
<tr>
<td>Guardar valor entre recomposições</td>
<td><code>remember</code> + <code>mutableStateOf</code></td>
</tr>
<tr>
<td>Ação ao clicar num botão</td>
<td><code>onClick</code></td>
</tr>
<tr>
<td>Código ao entrar no ecrã ou quando uma key muda</td>
<td><code>LaunchedEffect</code></td>
</tr>
</tbody>
</table>
<p><code>LaunchedEffect</code> <strong>não substitui</strong> <code>onClick</code> — corre no ciclo de vida da composição, não num evento do utilizador.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="148" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="148" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="launchedeffectunit--uma-vez">LaunchedEffect(Unit) — uma vez</h1>
<p><code>Unit</code> como key significa: executar <strong>uma vez</strong> ao entrar no ecrã:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">NewsScreen</span><span class="hljs-params">()</span></span> {
    <span class="hljs-keyword">var</span> headlines <span class="hljs-keyword">by</span> remember { mutableStateOf&lt;List&lt;String&gt;&gt;(emptyList()) }
    <span class="hljs-keyword">var</span> isLoading <span class="hljs-keyword">by</span> remember { mutableStateOf(<span class="hljs-literal">true</span>) }

    LaunchedEffect(<span class="hljs-built_in">Unit</span>) {
        headlines = api.fetchHeadlines()
        isLoading = <span class="hljs-literal">false</span>
    }

    <span class="hljs-keyword">if</span> (isLoading) {
        Text(<span class="hljs-string">&quot;A carregar notícias...&quot;</span>)
    } <span class="hljs-keyword">else</span> {
        Column {
            headlines.forEach { Text(it) }
        }
    }
}
</code></pre>
<p>Equivalente a <code>onCreate</code> / <code>onResume</code> para carregar dados na UI.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="149" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="149" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="launchedeffectkey--reagir-a-mudan%C3%A7as">LaunchedEffect(key) — reagir a mudanças</h1>
<p>Quando a <strong>key</strong> muda, o efeito anterior é <strong>cancelado</strong> e um novo começa:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">ProductDetail</span><span class="hljs-params">(productId: <span class="hljs-type">Int</span>)</span></span> {
    <span class="hljs-keyword">var</span> price <span class="hljs-keyword">by</span> remember { mutableStateOf&lt;<span class="hljs-built_in">Double</span>?&gt;(<span class="hljs-literal">null</span>) }

    LaunchedEffect(productId) {
        price = api.fetchPrice(productId)
    }

    Text(text = price?.let { <span class="hljs-string">&quot;€<span class="hljs-variable">$it</span>&quot;</span> } ?: <span class="hljs-string">&quot;—&quot;</span>)
}
</code></pre>
<p>Se <code>productId</code> passar de <code>1</code> para <code>2</code>, o pedido do produto <code>1</code> é cancelado.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="150" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="150" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="exemplo--temporizador">Exemplo — temporizador</h1>
<p><code>LaunchedEffect</code> com <code>delay</code> para atualizar a UI periodicamente:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">TimerScreen</span><span class="hljs-params">()</span></span> {
    <span class="hljs-keyword">var</span> seconds <span class="hljs-keyword">by</span> remember { mutableIntStateOf(<span class="hljs-number">0</span>) }

    LaunchedEffect(<span class="hljs-built_in">Unit</span>) {
        <span class="hljs-keyword">while</span> (<span class="hljs-literal">true</span>) {
            delay(<span class="hljs-number">1_000</span>)
            seconds++
        }
    }

    Text(
        text = <span class="hljs-string">&quot;<span class="hljs-variable">$seconds</span> s&quot;</span>,
        style = MaterialTheme.typography.displayLarge
    )
}
</code></pre>
<p>O <code>while (true)</code> é seguro — ao sair do ecrã, a coroutine é <strong>cancelada</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="151" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="151" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="launchedeffect-vs-onclick">LaunchedEffect vs onClick</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">SearchScreen</span><span class="hljs-params">()</span></span> {
    <span class="hljs-keyword">var</span> query <span class="hljs-keyword">by</span> remember { mutableStateOf(<span class="hljs-string">&quot;&quot;</span>) }
    <span class="hljs-keyword">var</span> results <span class="hljs-keyword">by</span> remember { mutableStateOf&lt;List&lt;String&gt;&gt;(emptyList()) }

    <span class="hljs-comment">// Carrega sugestões iniciais ao abrir o ecrã</span>
    LaunchedEffect(<span class="hljs-built_in">Unit</span>) {
        results = api.fetchSuggestions()
    }

  <span class="hljs-comment">// Pesquisa quando o utilizador carrega no botão</span>
    Column {
        TextField(value = query, onValueChange = { query = it })
        Button(onClick = {
            <span class="hljs-comment">// onClick NÃO é suspend — usar scope ou ViewModel</span>
        }) { Text(<span class="hljs-string">&quot;Pesquisar&quot;</span>) }
    }
}
</code></pre>
<p>Para ações do utilizador com código suspend, usar <code>rememberCoroutineScope()</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">val</span> scope = rememberCoroutineScope()
Button(onClick = {
    scope.launch { results = api.search(query) }
}) { Text(<span class="hljs-string">&quot;Pesquisar&quot;</span>) }
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="152" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="152" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="launchedeffect--resumo">LaunchedEffect — resumo</h1>
<ul>
<li>Corre dentro de um <code>@Composable</code>, numa <strong>coroutine</strong> ligada ao ciclo de vida da UI</li>
<li><strong>Cancela</strong> automaticamente quando o Composable deixa de estar visível</li>
<li><code>LaunchedEffect(Unit)</code> → executa uma vez ao entrar no ecrã</li>
<li><code>LaunchedEffect(key)</code> → reexecuta quando <code>key</code> muda</li>
<li>Ideal para: API REST, animações, timers, navegação com delay</li>
<li>Para cliques: <code>rememberCoroutineScope()</code> + <code>scope.launch { }</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="153" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="153" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="dailynews--obter-dados-da-api">DailyNews — obter dados da API</h1>
<p>A app <strong>DailyNews</strong> mostra notícias do dia obtidas de uma <strong>API REST</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>HomeView  →  LaunchedEffect  →  HomeViewModel.fetchArticles()
                                        ↓
                                   OkHttp (HTTP GET)
                                        ↓
                              NewsAPI (JSON)
                                        ↓
                              List&lt;Article&gt;  →  LazyColumn
</code></pre>
<p>Nesta secção: como usar <strong>OkHttp</strong> para fazer pedidos HTTP e parsear a resposta JSON.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="154" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="154" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="okhttp">OkHttp</h1>
<p><strong>OkHttp</strong> é uma biblioteca Square para comunicação <strong>HTTP/HTTPS</strong> em Android:</p>
<ul>
<li>Cliente HTTP leve e eficiente</li>
<li>Suporta GET, POST, PUT, DELETE, etc.</li>
<li>Pedidos <strong>assíncronos</strong> (não bloqueiam a UI thread)</li>
<li>Muito usado com APIs REST</li>
</ul>
<p>Alternativas: Retrofit (wrapper sobre OkHttp), Ktor, Volley.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="155" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="155" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="depend%C3%AAncia-okhttp">Dependência OkHttp</h1>
<p>Em <code>app/build.gradle.kts</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">dependencies {
    implementation(platform(<span class="hljs-string">&quot;com.squareup.okhttp3:okhttp-bom:4.11.0&quot;</span>))
    implementation(<span class="hljs-string">&quot;com.squareup.okhttp3:okhttp&quot;</span>)
    implementation(<span class="hljs-string">&quot;com.squareup.okhttp3:logging-interceptor&quot;</span>)
}
</code></pre>
<p>Permissão de Internet no <code>AndroidManifest.xml</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">uses-permission</span> <span class="hljs-attr">android:name</span>=<span class="hljs-string">&quot;android.permission.INTERNET&quot;</span>/&gt;</span>
</code></pre>
<p>Sem esta permissão, o pedido HTTP <strong>falha</strong> silenciosamente ou com erro de rede.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="156" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="156" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="newsapi--endpoint-rest">NewsAPI — endpoint REST</h1>
<p>A DailyNews consome a <a href="https://newsapi.org/">NewsAPI</a> — resposta em <strong>JSON</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>GET https://newsapi.org/v2/top-headlines?country=us&amp;apiKey=YOUR_API_KEY
</code></pre>
<p>Exemplo de resposta:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;status&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;ok&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;totalResults&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">20</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;articles&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">[</span>
    <span class="hljs-punctuation">{</span>
      <span class="hljs-attr">&quot;title&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Breaking news headline&quot;</span><span class="hljs-punctuation">,</span>
      <span class="hljs-attr">&quot;description&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Short summary of the article...&quot;</span><span class="hljs-punctuation">,</span>
      <span class="hljs-attr">&quot;url&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;https://example.com/article&quot;</span><span class="hljs-punctuation">,</span>
      <span class="hljs-attr">&quot;urlToImage&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;https://example.com/image.jpg&quot;</span><span class="hljs-punctuation">,</span>
      <span class="hljs-attr">&quot;publishedAt&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;2026-07-15T10:00:00Z&quot;</span>
    <span class="hljs-punctuation">}</span>
  <span class="hljs-punctuation">]</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="157" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="157" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="okhttp--pedido-get-b%C3%A1sico">OkHttp — pedido GET básico</h1>
<p>Três passos: <strong>cliente</strong> → <strong>pedido</strong> → <strong>executar</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">val</span> client = OkHttpClient()

<span class="hljs-keyword">val</span> request = Request.Builder()
    .url(<span class="hljs-string">&quot;https://newsapi.org/v2/top-headlines?country=us&amp;apiKey=YOUR_API_KEY&quot;</span>)
    .build()

client.newCall(request).enqueue(<span class="hljs-keyword">object</span> : Callback {
    <span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onFailure</span><span class="hljs-params">(call: <span class="hljs-type">Call</span>, e: <span class="hljs-type">IOException</span>)</span></span> {
        <span class="hljs-comment">// erro de rede (sem internet, timeout, etc.)</span>
        Log.e(<span class="hljs-string">&quot;DailyNews&quot;</span>, <span class="hljs-string">&quot;Erro: <span class="hljs-subst">${e.message}</span>&quot;</span>)
    }

    <span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onResponse</span><span class="hljs-params">(call: <span class="hljs-type">Call</span>, response: <span class="hljs-type">Response</span>)</span></span> {
        <span class="hljs-comment">// resposta recebida — processar JSON</span>
    }
})
</code></pre>
<p><code>enqueue()</code> corre em <strong>background</strong> — a UI não bloqueia.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="158" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="158" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="okhttp--processar-a-resposta">OkHttp — processar a resposta</h1>
<p>Dentro de <code>onResponse</code>, lemos o corpo e verificamos o código HTTP:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onResponse</span><span class="hljs-params">(call: <span class="hljs-type">Call</span>, response: <span class="hljs-type">Response</span>)</span></span> {
    response.use {
        <span class="hljs-keyword">if</span> (!response.isSuccessful) {
            <span class="hljs-keyword">throw</span> IOException(<span class="hljs-string">&quot;Código inesperado: <span class="hljs-subst">${response.code}</span>&quot;</span>)
        }
        <span class="hljs-keyword">val</span> jsonString = response.body!!.string()
        <span class="hljs-keyword">val</span> jsonResult = JSONObject(jsonString)

        <span class="hljs-keyword">if</span> (jsonResult.getString(<span class="hljs-string">&quot;status&quot;</span>) == <span class="hljs-string">&quot;ok&quot;</span>) {
            <span class="hljs-keyword">val</span> articlesJson = jsonResult.getJSONArray(<span class="hljs-string">&quot;articles&quot;</span>)
            <span class="hljs-comment">// parsear cada artigo...</span>
        }
    }
}
</code></pre>
<p><code>response.use { }</code> garante que o corpo é <strong>fechado</strong> após leitura.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="159" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="159" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="modelo-article--parse-json">Modelo Article — parse JSON</h1>
<p>Cada objeto JSON vira um <code>Article</code> Kotlin:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Article</span>(
    <span class="hljs-keyword">var</span> title: String? = <span class="hljs-literal">null</span>,
    <span class="hljs-keyword">var</span> description: String? = <span class="hljs-literal">null</span>,
    <span class="hljs-keyword">var</span> urlToImage: String? = <span class="hljs-literal">null</span>,
    <span class="hljs-keyword">var</span> url: String? = <span class="hljs-literal">null</span>,
    <span class="hljs-keyword">var</span> publishedAt: Date? = <span class="hljs-literal">null</span>
) {
    <span class="hljs-keyword">companion</span> <span class="hljs-keyword">object</span> {
        <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">fromJson</span><span class="hljs-params">(jsonObject: <span class="hljs-type">JSONObject</span>)</span></span>: Article {
            <span class="hljs-keyword">return</span> Article(
                title       = jsonObject.getString(<span class="hljs-string">&quot;title&quot;</span>),
                description = jsonObject.optString(<span class="hljs-string">&quot;description&quot;</span>, <span class="hljs-literal">null</span>),
                url         = jsonObject.getString(<span class="hljs-string">&quot;url&quot;</span>),
                urlToImage  = jsonObject.optString(<span class="hljs-string">&quot;urlToImage&quot;</span>, <span class="hljs-literal">null</span>),
                publishedAt = jsonObject.getString(<span class="hljs-string">&quot;publishedAt&quot;</span>).toDate()
            )
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="160" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="160" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="homeviewmodel--fetcharticles">HomeViewModel — fetchArticles()</h1>
<p>O ViewModel junta OkHttp + JSON parsing + <strong>StateFlow</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">HomeViewModel</span> : <span class="hljs-type">ViewModel</span>() {

    <span class="hljs-keyword">private</span> <span class="hljs-keyword">val</span> _uiState = MutableStateFlow(ArticlesState())
    <span class="hljs-keyword">val</span> uiState: StateFlow&lt;ArticlesState&gt; = _uiState.asStateFlow()

    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">fetchArticles</span><span class="hljs-params">(category: <span class="hljs-type">String</span>)</span></span> {
        _uiState.value = ArticlesState(isLoading = <span class="hljs-literal">true</span>)

        <span class="hljs-keyword">val</span> client = OkHttpClient()
        <span class="hljs-keyword">val</span> cat = <span class="hljs-keyword">if</span> (category.isNotEmpty()) <span class="hljs-string">&quot;&amp;category=<span class="hljs-variable">$category</span>&quot;</span> <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;&quot;</span>
        <span class="hljs-keyword">val</span> request = Request.Builder()
            .url(<span class="hljs-string">&quot;https://newsapi.org/v2/top-headlines?country=us<span class="hljs-variable">$cat</span>&amp;apiKey=YOUR_API_KEY&quot;</span>)
            .build()

        client.newCall(request).enqueue(<span class="hljs-comment">/* Callback — ver slide anterior */</span>)
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="161" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="161" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="homeviewmodel--callback-completo">HomeViewModel — Callback completo</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">client.newCall(request).enqueue(<span class="hljs-keyword">object</span> : Callback {
    <span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onFailure</span><span class="hljs-params">(call: <span class="hljs-type">Call</span>, e: <span class="hljs-type">IOException</span>)</span></span> {
        _uiState.value = ArticlesState(
            isLoading = <span class="hljs-literal">false</span>,
            error = e.message ?: <span class="hljs-string">&quot;Erro de rede&quot;</span>
        )
    }

    <span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onResponse</span><span class="hljs-params">(call: <span class="hljs-type">Call</span>, response: <span class="hljs-type">Response</span>)</span></span> {
        response.use {
            <span class="hljs-keyword">if</span> (!response.isSuccessful) <span class="hljs-keyword">throw</span> IOException(<span class="hljs-string">&quot;Código <span class="hljs-variable">$response</span>&quot;</span>)
            <span class="hljs-keyword">val</span> articlesResult = arrayListOf&lt;Article&gt;()
            <span class="hljs-keyword">val</span> jsonResult = JSONObject(response.body!!.string())

            <span class="hljs-keyword">if</span> (jsonResult.getString(<span class="hljs-string">&quot;status&quot;</span>) == <span class="hljs-string">&quot;ok&quot;</span>) {
                <span class="hljs-keyword">val</span> articlesJson = jsonResult.getJSONArray(<span class="hljs-string">&quot;articles&quot;</span>)
                <span class="hljs-keyword">for</span> (i <span class="hljs-keyword">in</span> <span class="hljs-number">0</span> until articlesJson.length()) {
                    articlesResult.add(
                        Article.fromJson(articlesJson.getJSONObject(i))
                    )
                }
            }
            _uiState.value = ArticlesState(
                isLoading = <span class="hljs-literal">false</span>,
                articles = articlesResult
            )
        }
    }
})
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="162" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="162" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="articlesstate--estado-da-ui">ArticlesState — estado da UI</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">data</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ArticlesState</span>(
    <span class="hljs-keyword">val</span> articles: ArrayList&lt;Article&gt; = arrayListOf(),
    <span class="hljs-keyword">val</span> error: String = <span class="hljs-string">&quot;&quot;</span>,
    <span class="hljs-keyword">val</span> isLoading: <span class="hljs-built_in">Boolean</span> = <span class="hljs-literal">false</span>,
)
</code></pre>
<p>Estados possíveis:</p>
<ul>
<li><code>isLoading = true</code> → mostrar &quot;Loading articles...&quot;</li>
<li><code>error</code> não vazio → mostrar mensagem de erro</li>
<li><code>articles</code> preenchida → mostrar <code>LazyColumn</code> com notícias</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="163" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="163" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="homeview--ligar-api-%C3%A0-ui">HomeView — ligar API à UI</h1>
<p><code>LaunchedEffect</code> dispara o pedido; <code>collectAsState</code> observa o resultado:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">HomeView</span><span class="hljs-params">(category: <span class="hljs-type">String</span>)</span></span> {
    <span class="hljs-keyword">val</span> viewModel: HomeViewModel = viewModel()
    <span class="hljs-keyword">val</span> state <span class="hljs-keyword">by</span> viewModel.uiState.collectAsState()

    LaunchedEffect(<span class="hljs-built_in">Unit</span>) {
        viewModel.fetchArticles(category)
    }

    <span class="hljs-keyword">when</span> {
        state.isLoading -&gt; Text(<span class="hljs-string">&quot;Loading articles...&quot;</span>)
        state.error.isNotEmpty() -&gt; Text(<span class="hljs-string">&quot;Erro: <span class="hljs-subst">${state.error}</span>&quot;</span>)
        state.articles.isEmpty() -&gt; Text(<span class="hljs-string">&quot;No articles found!&quot;</span>)
        <span class="hljs-keyword">else</span> -&gt; LazyColumn {
            items(state.articles) { article -&gt;
                RowArticle(article = article)
            }
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="164" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="164" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="fluxo-completo-dailynews">Fluxo completo DailyNews</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>1. HomeView entra em composição
2. LaunchedEffect chama viewModel.fetchArticles()
3. OkHttpClient faz GET à NewsAPI (background thread)
4. onResponse parseia JSON → List&lt;Article&gt;
5. _uiState.value atualizado
6. collectAsState() provoca recomposição
7. LazyColumn mostra RowArticle para cada notícia
</code></pre>
<p><strong>Regra:</strong> nunca fazer HTTP na <strong>Main Thread</strong> — usar <code>enqueue()</code> ou coroutines.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="165" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="165" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="okhttp--resumo">OkHttp — resumo</h1>
<table>
<thead>
<tr>
<th>Componente</th>
<th>Função</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>OkHttpClient()</code></td>
<td>cliente HTTP reutilizável</td>
</tr>
<tr>
<td><code>Request.Builder().url(...).build()</code></td>
<td>define o pedido GET/POST</td>
</tr>
<tr>
<td><code>client.newCall(request).enqueue(...)</code></td>
<td>executa de forma assíncrona</td>
</tr>
<tr>
<td><code>Callback.onFailure</code></td>
<td>trata erros de rede</td>
</tr>
<tr>
<td><code>Callback.onResponse</code></td>
<td>lê <code>response.body</code> e parseia JSON</td>
</tr>
<tr>
<td><code>StateFlow</code> + <code>collectAsState</code></td>
<td>expõe dados à UI Compose</td>
</tr>
</tbody>
</table>
<p>Próximo passo: <strong>Retrofit</strong> (OkHttp + anotações) ou <strong>Room</strong> para cache local.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="166" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="166" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="dailynews--navega%C3%A7%C3%A3o">DailyNews — navegação</h1>
<p>A app <strong>DailyNews</strong> usa duas barras de navegação:</p>
<ul>
<li><strong>Top Bar</strong> (<code>TopAppBar</code>) — título do ecrã, botão voltar, partilhar, bookmark</li>
<li><strong>Bottom Bar</strong> (<code>BottomAppBar</code>) — alternar entre Home, Technology, Sports, Bookmarks</li>
</ul>
<p>Ambas vivem dentro de um <strong><code>Scaffold</code></strong> — layout Material Design com slots para barras e conteúdo.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="167" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="167" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="scaffold">Scaffold</h1>
<p><code>Scaffold</code> organiza o ecrã em zonas fixas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">Scaffold(
    modifier = Modifier.fillMaxSize(),
    topBar = {
        MyTopAppBar(navController, title, isBaseScreen, articleString)
    },
    bottomBar = {
        MyBottomAppBar(navController)
    }
) { innerPadding -&gt;
    NavHost(
        navController = navController,
        startDestination = Screen.Home.route,
        modifier = Modifier.padding(innerPadding)
    ) {
        composable(Screen.Home.route) { HomeView(...) }
        composable(Screen.Technology.route) { HomeView(category = <span class="hljs-string">&quot;technology&quot;</span>) }
        composable(Screen.Sports.route) { HomeView(category = <span class="hljs-string">&quot;sports&quot;</span>) }
        composable(Screen.ReadLater.route) { ReadLaterView(...) }
        composable(Screen.Article.route) { ArticleDetail(...) }
    }
}
</code></pre>
<p><code>innerPadding</code> evita que o conteúdo fique <strong>por baixo</strong> das barras.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="168" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="168" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="rotas--sealed-class-screen">Rotas — sealed class Screen</h1>
<p>Cada destino de navegação tem uma <strong>rota</strong> (string):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">sealed</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Screen</span>(<span class="hljs-keyword">val</span> route: String) {
    <span class="hljs-keyword">object</span> Home       : Screen(<span class="hljs-string">&quot;home&quot;</span>)
    <span class="hljs-keyword">object</span> Technology : Screen(<span class="hljs-string">&quot;technology&quot;</span>)
    <span class="hljs-keyword">object</span> Sports     : Screen(<span class="hljs-string">&quot;sports&quot;</span>)
    <span class="hljs-keyword">object</span> ReadLater  : Screen(<span class="hljs-string">&quot;read_later&quot;</span>)
    <span class="hljs-keyword">object</span> Article    : Screen(<span class="hljs-string">&quot;article/{articleJson}&quot;</span>)
}
</code></pre>
<p>O <code>NavController</code> usa estas rotas para navegar entre ecrãs:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">navController.navigate(Screen.Technology.route)   <span class="hljs-comment">// ir para Technology</span>
navController.popBackStack()                      <span class="hljs-comment">// voltar ao ecrã anterior</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="169" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="169" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="bottom-bar--navigationbar">Bottom Bar — NavigationBar</h1>
<p>A barra inferior usa <code>NavigationBar</code> + <code>NavigationBarItem</code> (Material 3):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">data</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">BottomNavigationItem</span>(
    <span class="hljs-keyword">val</span> title: String,
    <span class="hljs-keyword">val</span> selectedIcon: ImageVector,
    <span class="hljs-keyword">val</span> unselectedIcon: ImageVector,
    <span class="hljs-keyword">val</span> screen: Screen,
)
</code></pre>
<p>Cada item tem:</p>
<ul>
<li><strong>title</strong> — label visível (&quot;Home&quot;, &quot;Sports&quot;, …)</li>
<li><strong>ícones</strong> — filled quando selecionado, outlined quando não</li>
<li><strong>screen</strong> — rota de destino ao clicar</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="170" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="170" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="mybottomappbar">MyBottomAppBar</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">MyBottomAppBar</span><span class="hljs-params">(navController: <span class="hljs-type">NavController</span>)</span></span> {
    <span class="hljs-keyword">var</span> selectedItemIndex <span class="hljs-keyword">by</span> rememberSaveable { mutableIntStateOf(<span class="hljs-number">0</span>) }

    <span class="hljs-keyword">val</span> items = listOf(
        BottomNavigationItem(<span class="hljs-string">&quot;Home&quot;</span>, Icons.Filled.Home, Icons.Outlined.Home, Screen.Home),
        BottomNavigationItem(<span class="hljs-string">&quot;Technology&quot;</span>, Icons.Filled.DateRange, Icons.Outlined.DateRange, Screen.Technology),
        BottomNavigationItem(<span class="hljs-string">&quot;Sports&quot;</span>, Icons.Filled.Settings, Icons.Outlined.Settings, Screen.Sports),
        BottomNavigationItem(<span class="hljs-string">&quot;Bookmark&quot;</span>, Icons.Filled.FavoriteBorder, Icons.Outlined.FavoriteBorder, Screen.ReadLater),
    )

    BottomAppBar {
        NavigationBar {
            items.forEachIndexed { index, item -&gt;
                NavigationBarItem(
                    selected = selectedItemIndex == index,
                    onClick = {
                        selectedItemIndex = index
                        navController.navigate(item.screen.route)
                    },
                    label = { Text(item.title) },
                    icon = {
                        Icon(
                            imageVector = <span class="hljs-keyword">if</span> (index == selectedItemIndex)
                                item.selectedIcon <span class="hljs-keyword">else</span> item.unselectedIcon,
                            contentDescription = item.title
                        )
                    }
                )
            }
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="171" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="171" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="bottom-bar--detalhes">Bottom Bar — detalhes</h1>
<ul>
<li><code>rememberSaveable</code> — mantém o item selecionado após rotação do ecrã</li>
<li><code>selectedItemIndex == index</code> — destaca o item ativo</li>
<li><code>navController.navigate(route)</code> — muda de ecrã ao clicar</li>
<li>Ícone <strong>filled</strong> vs <strong>outlined</strong> — feedback visual do estado selecionado</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌─────────────────────────────────────┐
│  <img class="emoji" draggable="false" alt="🏠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3e0.svg" data-marp-twemoji=""/> Home   <img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4c5.svg" data-marp-twemoji=""/> Tech   <img class="emoji" draggable="false" alt="⚙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> Sports  ♡ BM │  ← Bottom Bar
└─────────────────────────────────────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="172" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="172" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="top-bar--topappbar">Top Bar — TopAppBar</h1>
<p>A barra superior mostra o <strong>título</strong> e <strong>ações</strong> contextuais:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@OptIn(ExperimentalMaterial3Api::class)</span>
<span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">MyTopAppBar</span><span class="hljs-params">(
    navController: <span class="hljs-type">NavController</span>,
    title: <span class="hljs-type">String</span> = <span class="hljs-string">&quot;Home&quot;</span>,
    isBaseScreen: <span class="hljs-type">Boolean</span> = <span class="hljs-literal">true</span>,
    articleString: <span class="hljs-type">String</span>?
)</span></span> {
    TopAppBar(
        title = {
            Text(
                text = title,
                maxLines = <span class="hljs-number">1</span>,
                overflow = TextOverflow.Ellipsis
            )
        },
        navigationIcon = { <span class="hljs-comment">/* botão voltar — ver próximo slide */</span> },
        actions = { <span class="hljs-comment">/* partilhar e bookmark — ver próximo slide */</span> }
    )
}
</code></pre>
<p>Três zonas: <code>navigationIcon</code> (esquerda), <code>title</code> (centro), <code>actions</code> (direita).</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="173" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="173" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="top-bar--bot%C3%A3o-voltar">Top Bar — botão voltar</h1>
<p>Em ecrãs de <strong>detalhe</strong> (<code>isBaseScreen = false</code>), aparece o botão ← :</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">navigationIcon = {
    <span class="hljs-keyword">if</span> (!isBaseScreen) {
        IconButton(onClick = { navController.popBackStack() }) {
            Icon(
                imageVector = Icons.Filled.ArrowBack,
                contentDescription = <span class="hljs-string">&quot;Back&quot;</span>
            )
        }
    }
}
</code></pre>
<ul>
<li>Ecrãs base (Home, Sports, …) → <code>isBaseScreen = true</code> → <strong>sem</strong> botão voltar</li>
<li>Ecrã de artigo → <code>isBaseScreen = false</code> → botão voltar visível</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="174" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="174" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="top-bar--a%C3%A7%C3%B5es-share-e-bookmark">Top Bar — ações (Share e Bookmark)</h1>
<p>No ecrã de detalhe do artigo, aparecem ícones à direita:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">actions = {
    <span class="hljs-keyword">if</span> (!isBaseScreen) {
        IconButton(onClick = {
            <span class="hljs-keyword">val</span> sendIntent = Intent().apply {
                action = Intent.ACTION_SEND
                putExtra(Intent.EXTRA_TEXT, article.title)
                putExtra(Intent.EXTRA_SUBJECT, article.description)
                type = <span class="hljs-string">&quot;text/plain&quot;</span>
            }
            context.startActivity(Intent.createChooser(sendIntent, <span class="hljs-literal">null</span>))
        }) {
            Icon(Icons.Filled.Share, contentDescription = <span class="hljs-string">&quot;Share&quot;</span>)
        }

        IconButton(onClick = {
            <span class="hljs-comment">// guardar artigo na base de dados local (Room)</span>
        }) {
            Icon(Icons.Filled.FavoriteBorder, contentDescription = <span class="hljs-string">&quot;Bookmark&quot;</span>)
        }
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="175" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="175" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="mainactivity--ligar-tudo">MainActivity — ligar tudo</h1>
<p>O <code>MainActivity</code> gere o estado das barras e passa-o ao <code>Scaffold</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">val</span> navController = rememberNavController()
<span class="hljs-keyword">var</span> title <span class="hljs-keyword">by</span> remember { mutableStateOf(<span class="hljs-string">&quot;Home&quot;</span>) }
<span class="hljs-keyword">var</span> isBaseScreen <span class="hljs-keyword">by</span> remember { mutableStateOf(<span class="hljs-literal">true</span>) }
<span class="hljs-keyword">var</span> articleString <span class="hljs-keyword">by</span> remember { mutableStateOf(<span class="hljs-string">&quot;&quot;</span>) }

Scaffold(
    topBar = { MyTopAppBar(navController, title, isBaseScreen, articleString) },
    bottomBar = { MyBottomAppBar(navController) }
) { innerPadding -&gt;
    NavHost(navController, startDestination = Screen.Home.route, ...) {
        composable(Screen.Home.route) {
            title = <span class="hljs-string">&quot;Home&quot;</span>
            isBaseScreen = <span class="hljs-literal">true</span>
            HomeView(navController, category = <span class="hljs-string">&quot;&quot;</span>)
        }
        composable(Screen.Article.route) {
            isBaseScreen = <span class="hljs-literal">false</span>
            title = Article.fromJson(JSONObject(articleJson)).title ?: <span class="hljs-string">&quot;&quot;</span>
            ArticleDetail(navController, articleJson)
        }
    }
}
</code></pre>
<p>Cada rota <strong>atualiza</strong> <code>title</code> e <code>isBaseScreen</code> → Top Bar recompõe-se.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="176" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="176" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="top-bar-vs-bottom-bar">Top Bar vs Bottom Bar</h1>
<table>
<thead>
<tr>
<th></th>
<th>Top Bar</th>
<th>Bottom Bar</th>
</tr>
</thead>
<tbody>
<tr>
<td>Componente</td>
<td><code>TopAppBar</code></td>
<td><code>NavigationBar</code> + <code>BottomAppBar</code></td>
</tr>
<tr>
<td>Posição</td>
<td>topo do ecrã</td>
<td>fundo do ecrã</td>
</tr>
<tr>
<td>Função</td>
<td>título, voltar, ações</td>
<td>navegação entre secções principais</td>
</tr>
<tr>
<td>Visível em</td>
<td>todos os ecrãs</td>
<td>ecrãs base (Home, Sports, …)</td>
</tr>
<tr>
<td>Estado</td>
<td><code>title</code>, <code>isBaseScreen</code></td>
<td><code>selectedItemIndex</code></td>
</tr>
<tr>
<td>Navegação</td>
<td><code>popBackStack()</code> (voltar)</td>
<td><code>navigate(route)</code> (secções)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="177" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="177" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="barras-de-navega%C3%A7%C3%A3o--resumo">Barras de navegação — resumo</h1>
<ul>
<li><strong><code>Scaffold</code></strong> — contentor com slots <code>topBar</code>, <code>bottomBar</code> e conteúdo</li>
<li><strong><code>NavHost</code> + <code>NavController</code></strong> — navegação entre ecrãs por rotas</li>
<li><strong><code>NavigationBarItem</code></strong> — item da bottom bar com ícone + label</li>
<li><strong><code>TopAppBar</code></strong> — título + <code>navigationIcon</code> + <code>actions</code></li>
<li><strong><code>isBaseScreen</code></strong> — controla se mostra botão voltar e ações de detalhe</li>
<li><strong><code>rememberSaveable</code></strong> — preserva seleção da bottom bar entre rotações</li>
</ul>
<p>Próximo passo: <strong>Navigation Compose</strong> — argumentos, animações de transição.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="178" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="178" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="mvvm--model-view-viewmodel">MVVM — Model-View-ViewModel</h1>
<p>Padrão de arquitetura que <strong>separa</strong> responsabilidades da app:</p>
<ul>
<li><strong>Model</strong> — dados e lógica de negócio (API, base de dados, classes de domínio)</li>
<li><strong>View</strong> — interface visual (Compose, XML) — só <strong>mostra</strong> e <strong>reage</strong> a eventos</li>
<li><strong>ViewModel</strong> — intermediário — prepara dados para a View e gere <strong>estado</strong></li>
</ul>
<p>Objetivo: UI simples, lógica testável, código organizado.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="179" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="179" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="mvvm--vis%C3%A3o-geral">MVVM — visão geral</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌────────────────────── View (UI) ──────────────────────┐
│   HomeView                    ReadLaterView           │
└──────────┬──────────────────────────┬─────────────────┘
           │ observe uiState          │ getArticles()
           │ fetchArticles()          │
           ▼                          ▼
┌──────────────────── ViewModel ────────────────────────┐
│   HomeViewModel  ──────►  ArticlesState / StateFlow   │
└──────────┬────────────────────────────────────────────┘
           │
           ▼
┌────────────────────── Model ──────────────────────────┐
│   Article          OkHttp / NewsAPI       Room DB     │
└───────────────────────────────────────────────────────┘
</code></pre>
<p>A <strong>View</strong> nunca acede diretamente à API ou à base de dados.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="180" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="180" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="model">Model</h1>
<p>Representa os <strong>dados</strong> e a <strong>fonte de verdade</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// Classe de domínio</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Article</span>(
    <span class="hljs-keyword">var</span> title: String?,
    <span class="hljs-keyword">var</span> description: String?,
    <span class="hljs-keyword">var</span> urlToImage: String?,
    <span class="hljs-keyword">var</span> url: String?,
    <span class="hljs-keyword">var</span> publishedAt: Date?
)

<span class="hljs-comment">// Fontes de dados</span>
OkHttp  →  NewsAPI (JSON remoto)
Room    →  ArticleCache (JSON local)
</code></pre>
<p>O Model <strong>não sabe</strong> que existe um ecrã — só expõe dados e operações.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="181" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="181" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="view">View</h1>
<p>A <strong>View</strong> é a UI — em Compose, funções <code>@Composable</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">HomeView</span><span class="hljs-params">(category: <span class="hljs-type">String</span>)</span></span> {
    <span class="hljs-keyword">val</span> viewModel: HomeViewModel = viewModel()
    <span class="hljs-keyword">val</span> state <span class="hljs-keyword">by</span> viewModel.uiState.collectAsState()

    LaunchedEffect(<span class="hljs-built_in">Unit</span>) {
        viewModel.fetchArticles(category)
    }

    <span class="hljs-keyword">if</span> (state.isLoading) Text(<span class="hljs-string">&quot;Loading...&quot;</span>)
    <span class="hljs-keyword">else</span> LazyColumn {
        items(state.articles) { article -&gt;
            RowArticle(article = article)
        }
    }
}
</code></pre>
<p>A View <strong>não faz</strong> pedidos HTTP — apenas observa estado e chama o ViewModel.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="182" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="182" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="viewmodel">ViewModel</h1>
<p>O <strong>ViewModel</strong> gere o estado da UI e coordena o Model:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">HomeViewModel</span> : <span class="hljs-type">ViewModel</span>() {

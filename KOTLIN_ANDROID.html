    <span class="hljs-keyword">private</span> <span class="hljs-keyword">val</span> _uiState = MutableStateFlow(ArticlesState())
    <span class="hljs-keyword">val</span> uiState: StateFlow&lt;ArticlesState&gt; = _uiState.asStateFlow()

    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">fetchArticles</span><span class="hljs-params">(category: <span class="hljs-type">String</span>)</span></span> {
        _uiState.value = ArticlesState(isLoading = <span class="hljs-literal">true</span>)
        <span class="hljs-comment">// OkHttp → parse JSON → Article</span>
        _uiState.value = ArticlesState(
            isLoading = <span class="hljs-literal">false</span>,
            articles = articlesResult
        )
    }
}
</code></pre>
<p>Expõe <code>uiState</code> (read-only) — a View <strong>observa</strong>, nunca altera <code>_uiState</code> diretamente.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="183" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="183" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="fluxo-de-dados-mvvm">Fluxo de dados MVVM</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  View (HomeView)
       │
       │  fetchArticles(&quot;technology&quot;)
       ▼
  ViewModel (HomeViewModel)
       │
       │  uiState = isLoading = true
       ▼
  Model (API / Room)
       │
       │  OkHttp GET NewsAPI → JSON response
       ▼
  ViewModel (HomeViewModel)
       │
       │  Article.fromJson() × N
       │  uiState = articles + isLoading = false
       ▼
  View (HomeView)
       │
       │  StateFlow emite → collectAsState → recomposição
       ▼
  LazyColumn mostra artigos
</code></pre>
<p><strong>Unidirecional:</strong> View → ViewModel → Model → ViewModel → View</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="184" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="184" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="articlesstate--estado-da-ui-1">ArticlesState — estado da UI</h1>
<p>O ViewModel expõe <strong>todo o estado</strong> num único objeto:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">data</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ArticlesState</span>(
    <span class="hljs-keyword">val</span> articles: ArrayList&lt;Article&gt; = arrayListOf(),
    <span class="hljs-keyword">val</span> error: String = <span class="hljs-string">&quot;&quot;</span>,
    <span class="hljs-keyword">val</span> isLoading: <span class="hljs-built_in">Boolean</span> = <span class="hljs-literal">false</span>,
)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>                    fetchArticles()
                         │
                         ▼
                   ┌──────────┐
                   │ Loading  │
                   └────┬─────┘
          ┌──────────────┼──────────────┐
          │              │              │
    JSON ok         onFailure     lista vazia
          │              │              │
          ▼              ▼              ▼
    ┌──────────┐   ┌──────────┐   ┌──────────┐
    │ Success  │   │  Error   │   │  Empty   │
    └────┬─────┘   └────┬─────┘   └────┬─────┘
         │              │              │
         └──────── refresh / retry ────┘
                         │
                         ▼
                   ┌──────────┐
                   │ Loading  │
                   └──────────┘
</code></pre>
<p>A View decide <strong>o que mostrar</strong> com base no estado — sem lógica de negócio.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="185" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="185" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="dailynews--mapeamento-mvvm">DailyNews — mapeamento MVVM</h1>
<table>
<thead>
<tr>
<th>Camada</th>
<th>Ficheiros DailyNews</th>
<th>Responsabilidade</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Model</strong></td>
<td><code>Article.kt</code>, <code>ArticleCache.kt</code>, <code>AppDatabase.kt</code></td>
<td>dados, JSON, Room</td>
</tr>
<tr>
<td><strong>View</strong></td>
<td><code>HomeView.kt</code>, <code>ReadLaterView.kt</code>, <code>RowArticle.kt</code></td>
<td>UI Compose</td>
</tr>
<tr>
<td><strong>ViewModel</strong></td>
<td><code>HomeViewModel.kt</code>, <code>ReadLaterViewModel.kt</code></td>
<td>estado, OkHttp, cache</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  HomeView ──────────► HomeViewModel ──────────► Article + NewsAPI
                              │
  ReadLaterView ───► ReadLaterViewModel ──────► Article + Room
</code></pre>
<p>Um ViewModel por <strong>ecrã</strong> ou <strong>funcionalidade</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="186" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="186" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="viewmodel-e-ciclo-de-vida">ViewModel e ciclo de vida</h1>
<p>O ViewModel <strong>sobrevive</strong> a rotações de ecrã — a View é recriada, o ViewModel <strong>não</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌────────────────────── Activity ───────────────────────┐
│                                                       │
│   View (antes)  ──destruída──►  View (depois)         │
│        │                            │                 │
│        │      viewModel()           │ viewModel()     │
│        └────────────┬───────────────┘                 │
│                     ▼                                 │
│         ┌─────────────────────────┐                   │
│         │ ViewModel (mantém uiState)│                 │
│         └─────────────────────────┘                   │
│                                                       │
└───────────────────────────────────────────────────────┘
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">val</span> viewModel: HomeViewModel = viewModel()  <span class="hljs-comment">// mesma instância após rotação</span>
</code></pre>
<p>Os dados carregados <strong>não se perdem</strong> ao rodar o telemóvel.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="187" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="187" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="mvvm-vs-l%C3%B3gica-na-view">MVVM vs lógica na View</h1>
<p><strong>Sem MVVM</strong> — tudo na Activity/Composable:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  ┌──────────┐
  │ HomeView │
  └────┬─────┘
       ├──────────────► OkHttp
       ├──────────────► Room
       └──────────────► JSON parse
</code></pre>
<p><strong>Com MVVM</strong> — responsabilidades separadas:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  ┌──────────┐      ┌────────────┐
  │ HomeView │ ───► │ ViewModel  │
  └──────────┘      └─────┬──────┘
                          ├──────────────► OkHttp
                          ├──────────────► Room
                          └──────────────► JSON parse
</code></pre>
<p>Benefícios: UI mais simples, ViewModel <strong>testável</strong> sem emulador, reutilização de lógica.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="188" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="188" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="stateflow--collectasstate">StateFlow + collectAsState</h1>
<p>Ligação reativa entre ViewModel e View:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// ViewModel — fonte de verdade</span>
<span class="hljs-keyword">private</span> <span class="hljs-keyword">val</span> _uiState = MutableStateFlow(ArticlesState())
<span class="hljs-keyword">val</span> uiState: StateFlow&lt;ArticlesState&gt; = _uiState.asStateFlow()

<span class="hljs-comment">// View — observa mudanças</span>
<span class="hljs-keyword">val</span> state <span class="hljs-keyword">by</span> viewModel.uiState.collectAsState()
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  ┌─────────────────┐
  │ _uiState        │  (privado)
  │ (MutableStateFlow)
  └────────┬────────┘
           │ asStateFlow()
           ▼
  ┌─────────────────┐
  │ uiState         │  (público)
  │ (StateFlow)     │
  └────────┬────────┘
           │ collectAsState()
           ▼
  ┌─────────────────┐
  │ View recomposes │
  └────────┬────────┘
           │ fetchArticles()
           ▼
  ┌─────────────────┐
  │ ViewModel       │ ──atualiza──► _uiState
  └─────────────────┘
</code></pre>
<p>Quando <code>_uiState</code> muda → View <strong>recompõe-se</strong> automaticamente.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="189" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="189" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="mvvm--resumo">MVVM — resumo</h1>
<table>
<thead>
<tr>
<th>Camada</th>
<th>Faz</th>
<th>Não faz</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Model</strong></td>
<td>dados, API, BD, regras de negócio</td>
<td>conhecer a UI</td>
</tr>
<tr>
<td><strong>View</strong></td>
<td>mostrar UI, eventos do utilizador</td>
<td>pedidos HTTP, SQL</td>
</tr>
<tr>
<td><strong>ViewModel</strong></td>
<td>estado UI, chamar Model</td>
<td>referências a Views/Context*</td>
</tr>
</tbody>
</table>
<p>* Evitar guardar <code>Context</code> no ViewModel — usar <code>viewModelScope</code> + callbacks.</p>
<p>Próximo passo: <strong>Clean Architecture</strong> — camadas Repository, UseCase, DI.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="190" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="190" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="dailynews--room">DailyNews — Room</h1>
<p>A app <strong>DailyNews</strong> guarda artigos favoritos <strong>localmente</strong> com <strong>Room</strong>:</p>
<ul>
<li>Utilizador carrega ♡ no Top Bar → artigo guardado na BD</li>
<li>Ecrã <strong>Bookmarks</strong> (<code>ReadLaterView</code>) → lê artigos da BD</li>
<li>Funciona <strong>offline</strong> — sem internet</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  NewsAPI (OkHttp)              Room (SQLite)
       │                              │
       ▼                              ▼
  HomeView — notícias          ReadLaterView — favoritos
  (dados remotos)              (dados locais)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="191" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="191" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="o-que-%C3%A9-room">O que é Room?</h1>
<p><strong>Room</strong> é a biblioteca Android para base de dados <strong>SQLite</strong> com:</p>
<ul>
<li><strong>Compile-time verification</strong> — erros SQL detetados ao compilar</li>
<li><strong>Coroutines</strong> — queries com <code>suspend</code></li>
<li><strong>Integração Kotlin</strong> — menos código boilerplate que SQLite directo</li>
</ul>
<p>Três componentes principais:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  @Entity  ──►  tabela SQLite
  @Dao      ──►  queries (SELECT, INSERT, DELETE)
  @Database ──►  liga Entity + Dao
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="192" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="192" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="depend%C3%AAncia-room">Dependência Room</h1>
<p>Em <code>app/build.gradle.kts</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">val</span> roomVersion = <span class="hljs-string">&quot;2.6.1&quot;</span>
implementation(<span class="hljs-string">&quot;androidx.room:room-runtime:<span class="hljs-variable">$roomVersion</span>&quot;</span>)
ksp(<span class="hljs-string">&quot;androidx.room:room-compiler:<span class="hljs-variable">$roomVersion</span>&quot;</span>)
implementation(<span class="hljs-string">&quot;androidx.room:room-ktx:<span class="hljs-variable">$roomVersion</span>&quot;</span>)
</code></pre>
<ul>
<li><code>room-runtime</code> — biblioteca Room</li>
<li><code>room-compiler</code> (KSP) — gera código SQL em <strong>compile time</strong></li>
<li><code>room-ktx</code> — suporte a coroutines (<code>suspend</code>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="193" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="193" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="entity--articlecache">Entity — ArticleCache</h1>
<p>Uma <strong>Entity</strong> representa uma <strong>tabela</strong> na base de dados:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Entity</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">ArticleCache</span>(
    <span class="hljs-meta">@field:PrimaryKey</span>
    <span class="hljs-keyword">var</span> url: String,
    <span class="hljs-keyword">var</span> jsonContent: String? = <span class="hljs-literal">null</span>
)
</code></pre>
<table>
<thead>
<tr>
<th>Campo</th>
<th>Tipo</th>
<th>Descrição</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>url</code></td>
<td><code>String</code></td>
<td>chave primária — identifica o artigo</td>
</tr>
<tr>
<td><code>jsonContent</code></td>
<td><code>String?</code></td>
<td>artigo serializado em JSON</td>
</tr>
</tbody>
</table>
<p>Guardamos o artigo completo como <strong>JSON</strong> — fácil de reconstruir com <code>Article.fromJson()</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="194" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="194" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="dao--articlecachedao">DAO — ArticleCacheDao</h1>
<p>O <strong>DAO</strong> (Data Access Object) define as <strong>operações</strong> SQL:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Dao</span>
<span class="hljs-keyword">interface</span> <span class="hljs-title class_">ArticleCacheDao</span> {

    <span class="hljs-meta">@Query(<span class="hljs-string">&quot;SELECT * FROM ArticleCache&quot;</span>)</span>
    <span class="hljs-keyword">suspend</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">getAll</span><span class="hljs-params">()</span></span>: List&lt;ArticleCache&gt;

    <span class="hljs-meta">@Query(<span class="hljs-string">&quot;SELECT * FROM ArticleCache WHERE url = :url&quot;</span>)</span>
    <span class="hljs-keyword">suspend</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">getByUrl</span><span class="hljs-params">(url: <span class="hljs-type">String</span>)</span></span>: ArticleCache

    <span class="hljs-meta">@Query(<span class="hljs-string">&quot;DELETE FROM ArticleCache WHERE url = :url&quot;</span>)</span>
    <span class="hljs-keyword">suspend</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">delete</span><span class="hljs-params">(url: <span class="hljs-type">String</span>)</span></span>

    <span class="hljs-meta">@Insert(onConflict = OnConflictStrategy.REPLACE)</span>
    <span class="hljs-keyword">suspend</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">insert</span><span class="hljs-params">(articleCache: <span class="hljs-type">ArticleCache</span>)</span></span>
}
</code></pre>
<p>Room <strong>gera</strong> a implementação — não escrevemos SQL manualmente no código Kotlin.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="195" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="195" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="database--appdatabase">Database — AppDatabase</h1>
<p>A classe <code>@Database</code> liga Entity e DAO:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Database(entities = [ArticleCache::class], version = 1)</span>
<span class="hljs-keyword">abstract</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">AppDatabase</span> : <span class="hljs-type">RoomDatabase</span>() {

    <span class="hljs-keyword">abstract</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">articleCacheDao</span><span class="hljs-params">()</span></span>: ArticleCacheDao

    <span class="hljs-keyword">companion</span> <span class="hljs-keyword">object</span> {
        <span class="hljs-meta">@Volatile</span>
        <span class="hljs-keyword">private</span> <span class="hljs-keyword">var</span> INSTANCE: AppDatabase? = <span class="hljs-literal">null</span>

        <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">getDatabase</span><span class="hljs-params">(context: <span class="hljs-type">Context</span>)</span></span>: AppDatabase? {
            <span class="hljs-keyword">if</span> (INSTANCE == <span class="hljs-literal">null</span>) {
                synchronized(AppDatabase::<span class="hljs-keyword">class</span>.java) {
                    <span class="hljs-keyword">if</span> (INSTANCE == <span class="hljs-literal">null</span>) {
                        INSTANCE = Room.databaseBuilder(
                            context.applicationContext,
                            AppDatabase::<span class="hljs-keyword">class</span>.java,
                            <span class="hljs-string">&quot;db_news&quot;</span>
                        ).fallbackToDestructiveMigration().build()
                    }
                }
            }
            <span class="hljs-keyword">return</span> INSTANCE
        }
    }
}
</code></pre>
<p><strong>Singleton</strong> — uma única instância da BD em toda a app.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="196" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="196" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">

<p>Ao carregar ♡ no ecrã de detalhe, o artigo é <strong>inserido</strong> na BD:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">IconButton(onClick = {
    GlobalScope.launch(Dispatchers.IO) {
        AppDatabase.getDatabase(context)
            ?.articleCacheDao()
            ?.insert(
                ArticleCache(
                    url = article.url ?: <span class="hljs-string">&quot;&quot;</span>,
                    jsonContent = articleString
                )
            )
    }
}) {
    Icon(Icons.Filled.FavoriteBorder, contentDescription = <span class="hljs-string">&quot;Bookmark&quot;</span>)
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Utilizador carrega ♡
         │
         ▼
  ArticleCache(url, jsonContent)
         │
         ▼
  articleCacheDao.insert()  ──►  tabela ArticleCache
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="197" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="197" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="ler-bookmarks--readlaterview">Ler bookmarks — ReadLaterView</h1>
<p>O ecrã <strong>Bookmarks</strong> lê artigos guardados via ViewModel:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">ReadLaterView</span><span class="hljs-params">()</span></span> {
    <span class="hljs-keyword">val</span> viewModel: HomeViewModel = viewModel()
    <span class="hljs-keyword">val</span> state <span class="hljs-keyword">by</span> viewModel.uiState.collectAsState()
    <span class="hljs-keyword">val</span> context = LocalContext.current

    LaunchedEffect(<span class="hljs-built_in">Unit</span>) {
        viewModel.getArticles(context)
    }

    <span class="hljs-comment">// LazyColumn com state.articles...</span>
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">getArticles</span><span class="hljs-params">(context: <span class="hljs-type">Context</span>)</span></span> {
    _uiState.value = ArticlesState(isLoading = <span class="hljs-literal">true</span>)
    viewModelScope.launch(Dispatchers.IO) {
        <span class="hljs-keyword">val</span> cached = AppDatabase.getDatabase(context)
            ?.articleCacheDao()?.getAll()

        <span class="hljs-keyword">val</span> articles = arrayListOf&lt;Article&gt;()
        <span class="hljs-keyword">for</span> (a <span class="hljs-keyword">in</span> cached ?: emptyList()) {
            a.jsonContent?.let {
                articles.add(Article.fromJson(JSONObject(it)))
            }
        }
        _uiState.value = ArticlesState(
            isLoading = <span class="hljs-literal">false</span>,
            articles = articles
        )
    }
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="198" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="198" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="fluxo-room-na-dailynews">Fluxo Room na DailyNews</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  ┌─────────────┐     insert      ┌──────────────────┐
  │  Top Bar ♡  │ ──────────────► │  ArticleCache    │
  └─────────────┘                 │  (Room / SQLite) │
                                  └────────┬─────────┘
                                           │ getAll()
                                           ▼
  ┌─────────────┐     observe     ┌──────────────────┐
  │ ReadLater   │ ◄────────────── │  ViewModel       │
  │ View        │                 │  getArticles()   │
  └─────────────┘                 └──────────────────┘
         │
         ▼
  LazyColumn → RowArticle (offline)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="199" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="199" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="okhttp-vs-room">OkHttp vs Room</h1>
<table>
<thead>
<tr>
<th></th>
<th>OkHttp (NewsAPI)</th>
<th>Room (SQLite)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Dados</td>
<td>remotos (internet)</td>
<td>locais (dispositivo)</td>
</tr>
<tr>
<td>Ecrã</td>
<td>Home, Technology, Sports</td>
<td>Bookmarks</td>
</tr>
<tr>
<td>Formato</td>
<td>JSON da API</td>
<td>JSON guardado em <code>ArticleCache</code></td>
</tr>
<tr>
<td>Offline</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> precisa de internet</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> funciona offline</td>
</tr>
<tr>
<td>Operação</td>
<td>GET HTTP</td>
<td>SELECT / INSERT</td>
</tr>
</tbody>
</table>
<p>Na DailyNews: <strong>OkHttp</strong> para notícias do dia, <strong>Room</strong> para favoritos do utilizador.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="200" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="200" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="room--resumo">Room — resumo</h1>
<table>
<thead>
<tr>
<th>Componente</th>
<th>Anotação</th>
<th>Função</th>
</tr>
</thead>
<tbody>
<tr>
<td>Entity</td>
<td><code>@Entity</code></td>
<td>define tabela (<code>ArticleCache</code>)</td>
</tr>
<tr>
<td>DAO</td>
<td><code>@Dao</code></td>
<td>queries SQL (<code>getAll</code>, <code>insert</code>, <code>delete</code>)</td>
</tr>
<tr>
<td>Database</td>
<td><code>@Database</code></td>
<td>liga tudo + <code>Room.databaseBuilder</code></td>
</tr>
</tbody>
</table>
<p>Regras:</p>
<ul>
<li>Queries pesadas em <strong><code>Dispatchers.IO</code></strong> — nunca na Main Thread</li>
<li>Usar <strong><code>suspend</code></strong> nas funções DAO (room-ktx)</li>
<li>Uma instância da BD (<strong>Singleton</strong>) via <code>getDatabase(context)</code></li>
</ul>
<p>Próximo passo: <strong>Repository</strong> — unificar OkHttp + Room numa única fonte de dados.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="201" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="201" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firebase">Firebase</h1>
<p><strong>Firebase</strong> é uma plataforma Google (<strong>BaaS</strong> — Backend as a Service) para apps móveis e web:</p>
<ul>
<li><strong>Autenticação</strong> — login email/password, Google, etc.</li>
<li><strong>Firestore</strong> — base de dados NoSQL na cloud, em tempo real</li>
<li><strong>Cloud Messaging (FCM)</strong> — notificações push</li>
<li><strong>Analytics</strong> — estatísticas de utilização</li>
<li><strong>Storage</strong> — ficheiros (imagens, vídeos)</li>
</ul>
<p>Sem servidor próprio — a Google gere a infraestrutura.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="202" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="202" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="shoppinglist--exemplo-firebase">ShoppingList — exemplo Firebase</h1>
<p>A app <strong>ShoppingList</strong> usa Firebase para:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Login (Firebase Auth)
         │
         ▼
  Home — listar carrinhos do utilizador (Firestore)
         │
         ▼
  Products — produtos do carrinho (Firestore subcollection)
         │
         ▼
  Sincronização em tempo real entre dispositivos
</code></pre>
<p>Cada utilizador autenticado vê <strong>apenas os seus carrinhos</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="203" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="203" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="servi%C3%A7os-firebase-na-shoppinglist">Serviços Firebase na ShoppingList</h1>
<table>
<thead>
<tr>
<th>Serviço</th>
<th>Uso na app</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Firebase Auth</strong></td>
<td>login email + password</td>
</tr>
<tr>
<td><strong>Cloud Firestore</strong></td>

</tr>
<tr>
<td><strong>Firebase Analytics</strong></td>

</tr>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  ┌─────────────┐     ┌─────────────────────────────┐
  │ Android App │ ◄──►│  Firebase (Google Cloud)    │
  └─────────────┘     │  Auth │ Firestore │ FCM     │
                      └─────────────────────────────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="204" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="204" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="configura%C3%A7%C3%A3o--buildgradle">Configuração — build.gradle</h1>
<p><strong>Project</strong> <code>build.gradle.kts</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">plugins {
    id(<span class="hljs-string">&quot;com.google.gms.google-services&quot;</span>) version <span class="hljs-string">&quot;4.4.2&quot;</span> apply <span class="hljs-literal">false</span>
}
</code></pre>
<p><strong>App</strong> <code>build.gradle.kts</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">plugins {
    id(<span class="hljs-string">&quot;com.google.gms.google-services&quot;</span>)
}

dependencies {
    implementation(platform(<span class="hljs-string">&quot;com.google.firebase:firebase-bom:34.4.0&quot;</span>))
    implementation(<span class="hljs-string">&quot;com.google.firebase:firebase-analytics&quot;</span>)

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="205" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="205" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firebase-auth--login">Firebase Auth — login</h1>
<p>Autenticação com email e password:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">LoginViewModel</span> : <span class="hljs-type">ViewModel</span>() {

    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">login</span><span class="hljs-params">(onLoginSuccess: () -&gt; <span class="hljs-type">Unit</span>)</span></span> {
        uiState.value = uiState.value.copy(isLoading = <span class="hljs-literal">true</span>)

        Firebase.auth.signInWithEmailAndPassword(
            uiState.value.email!!,
            uiState.value.password!!
        ).addOnCompleteListener { task -&gt;
            <span class="hljs-keyword">if</span> (task.isSuccessful) {
                uiState.value = uiState.value.copy(isLoading = <span class="hljs-literal">false</span>, error = <span class="hljs-literal">null</span>)
                onLoginSuccess()
            } <span class="hljs-keyword">else</span> {
                uiState.value = uiState.value.copy(
                    isLoading = <span class="hljs-literal">false</span>,
                    error = <span class="hljs-string">&quot;Wrong password or no internet connection&quot;</span>
                )
            }
        }
    }
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  email + password  ──►  Firebase Auth  ──►  uid (ID único do utilizador)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="206" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="206" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="utilizador-autenticado">Utilizador autenticado</h1>
<p>Após login, acedemos ao utilizador actual:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// MainActivity — saltar login se já autenticado</span>
LaunchedEffect(<span class="hljs-built_in">Unit</span>) {
    <span class="hljs-keyword">val</span> userID = Firebase.auth.currentUser?.uid
    <span class="hljs-keyword">if</span> (userID != <span class="hljs-literal">null</span>) {
        navController.navigate(<span class="hljs-string">&quot;home&quot;</span>)
    }
}

<span class="hljs-comment">// HomeViewModel — criar carrinho associado ao utilizador</span>
<span class="hljs-keyword">val</span> userID = Firebase.auth.currentUser?.uid
<span class="hljs-keyword">val</span> cart = Cart(
    name = <span class="hljs-string">&quot;New cart <span class="hljs-subst">${uiState.value.carts.size + <span class="hljs-number">1</span>}</span>&quot;</span>,
    owners = listOf(userID!!)
)
</code></pre>
<p><code>currentUser?.uid</code> identifica o utilizador em <strong>todas</strong> as operações Firestore.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="207" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="207" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="cloud-firestore--estrutura">Cloud Firestore — estrutura</h1>
<p>Firestore é <strong>NoSQL</strong> — dados organizados em <strong>collections</strong> e <strong>documents</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Firestore
└── carts/                          ← collection
    ├── abc123/                     ← document (Cart)
    │   ├── name: &quot;Compras semana&quot;
    │   ├── owners: [&quot;uid_user_1&quot;]
    │   └── products/               ← subcollection
    │       ├── prod1/              ← document (Product)
    │       │   ├── name: &quot;Leite&quot;
    │       │   └── checked: false
    │       └── prod2/
    │           ├── name: &quot;Pão&quot;
    │           └── checked: true
    └── def456/
        └── ...
</code></pre>
<p>Equivalente a JSON na cloud — <strong>sem SQL</strong>, <strong>sem schemas fixos</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="208" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="208" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="modelo-cart">Modelo Cart</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">data</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Cart</span>(
    <span class="hljs-keyword">var</span> docId: String? = <span class="hljs-literal">null</span>,
    <span class="hljs-keyword">var</span> name: String? = <span class="hljs-literal">null</span>,
    <span class="hljs-keyword">var</span> owners: List&lt;String&gt;? = <span class="hljs-literal">null</span>,
)
</code></pre>
<p>Firestore converte automaticamente entre <code>Cart</code> Kotlin e document JSON:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// Kotlin → Firestore</span>
db.collection(<span class="hljs-string">&quot;carts&quot;</span>).add(cart)

<span class="hljs-comment">// Firestore → Kotlin</span>
<span class="hljs-keyword">val</span> cart = doc.toObject(Cart::<span class="hljs-keyword">class</span>.java)
cart?.docId = doc.id
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="209" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="209" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firestore--ler-dados">Firestore — ler dados</h1>
<p>Obter carrinhos do utilizador actual:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">CartRepository</span>(<span class="hljs-keyword">private</span> <span class="hljs-keyword">val</span> db: FirebaseFirestore) {

    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">fetchCarts</span><span class="hljs-params">()</span></span>: Flow&lt;ResultWrapper&lt;List&lt;Cart&gt;&gt;&gt; = flow {
        emit(ResultWrapper.Loading())

        <span class="hljs-keyword">val</span> query = db.collection(<span class="hljs-string">&quot;carts&quot;</span>)
            .whereArrayContains(<span class="hljs-string">&quot;owners&quot;</span>, Firebase.auth.currentUser?.uid!!)

        query.snapshotFlow().collect { snapshot -&gt;
            <span class="hljs-keyword">val</span> carts = mutableListOf&lt;Cart&gt;()
            <span class="hljs-keyword">for</span> (doc <span class="hljs-keyword">in</span> snapshot.documents) {
                <span class="hljs-keyword">val</span> cart = doc.toObject(Cart::<span class="hljs-keyword">class</span>.java)
                cart?.docId = doc.id
                cart?.let { carts.add(it) }
            }
            emit(ResultWrapper.Success(carts.toList()))
        }
    }.flowOn(Dispatchers.IO)
}
</code></pre>
<p><code>whereArrayContains(&quot;owners&quot;, uid)</code> — só carrinhos onde o utilizador está em <code>owners</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="210" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="210" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firestore--escrever-dados">Firestore — escrever dados</h1>
<p>Criar um novo carrinho:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">createCart</span><span class="hljs-params">(cart: <span class="hljs-type">Cart</span>)</span></span>: Flow&lt;ResultWrapper&lt;<span class="hljs-built_in">Unit</span>&gt;&gt; = flow {
    emit(ResultWrapper.Loading())

    db.collection(<span class="hljs-string">&quot;carts&quot;</span>)
        .add(cart)          <span class="hljs-comment">// gera document ID automaticamente</span>
        .await()

    emit(ResultWrapper.Success(<span class="hljs-built_in">Unit</span>))
}.flowOn(Dispatchers.IO)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Cart(name, owners)  ──►  db.collection(&quot;carts&quot;).add(cart)  ──►  Firestore
</code></pre>
<p>Operações comuns:</p>
<table>
<thead>
<tr>
<th>Operação</th>
<th>Código</th>
</tr>
</thead>
<tbody>
<tr>
<td>Criar</td>
<td><code>.add(obj)</code> ou <code>.document(id).set(obj)</code></td>
</tr>
<tr>
<td>Ler</td>
<td><code>.get()</code> ou <code>.addSnapshotListener { }</code></td>
</tr>
<tr>
<td>Atualizar</td>
<td><code>.document(id).update(&quot;campo&quot;, valor)</code></td>
</tr>
<tr>
<td>Apagar</td>
<td><code>.document(id).delete()</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="211" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="211" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firestore--tempo-real">Firestore — tempo real</h1>
<p><code>addSnapshotListener</code> notifica a app quando os dados <strong>mudam</strong>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">fetchProducts</span><span class="hljs-params">(cartId: <span class="hljs-type">String</span>)</span></span> {
    db.collection(<span class="hljs-string">&quot;carts&quot;</span>)
        .document(cartId)
        .collection(<span class="hljs-string">&quot;products&quot;</span>)
        .addSnapshotListener { snapshot, error -&gt;
            <span class="hljs-keyword">if</span> (error != <span class="hljs-literal">null</span>) <span class="hljs-keyword">return</span><span class="hljs-symbol">@addSnapshotListener</span>

            <span class="hljs-keyword">val</span> products = mutableListOf&lt;Product&gt;()
            <span class="hljs-keyword">for</span> (doc <span class="hljs-keyword">in</span> snapshot?.documents ?: emptyList()) {
                <span class="hljs-keyword">val</span> product = doc.toObject(Product::<span class="hljs-keyword">class</span>.java)
                product?.docId = doc.id
                product?.let { products.add(it) }
            }
            uiState.value = uiState.value.copy(products = products)
        }
}
</code></pre>
<p>Utilizador A marca item ✓ → Utilizador B vê a alteração <strong>instantaneamente</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="212" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="212" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firestore--atualizar-campo">Firestore — atualizar campo</h1>
<p>Marcar produto como comprado:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">checkItem</span><span class="hljs-params">(product: <span class="hljs-type">Product</span>, checked: <span class="hljs-type">Boolean</span>)</span></span> {
    db.collection(<span class="hljs-string">&quot;carts&quot;</span>)
        .document(cartId!!)
        .collection(<span class="hljs-string">&quot;products&quot;</span>)
        .document(product.docId!!)
        .update(<span class="hljs-string">&quot;checked&quot;</span>, checked)
        .addOnSuccessListener {
            Log.d(TAG, <span class="hljs-string">&quot;DocumentSnapshot successfully updated!&quot;</span>)
        }
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  checkItem(prod, true)  ──►  update(&quot;checked&quot;, true)  ──►  listener dispara  ──►  UI atualiza
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="213" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="213" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="fluxo-shoppinglist--firebase">Fluxo ShoppingList + Firebase</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  ┌──────────┐   signIn    ┌──────────────┐
  │ LoginView│ ──────────► │ Firebase Auth │
  └──────────┘             └──────┬───────┘
                                  │ uid
  ┌──────────┐   fetchCarts       ▼
  │ HomeView │ ◄──────────  ┌──────────────┐
  └──────────┘              │  Firestore   │
       │                    │  collection  │
       │ createCart          │  &quot;carts&quot;     │
       └──────────────────► └──────┬───────┘
                                  │
  ┌────────────┐  snapshotListener ▼
  │ ProductsView│ ◄──────── subcollection &quot;products&quot;
  └────────────┘
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="214" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="214" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firebase-vs-okhttp-vs-room">Firebase vs OkHttp vs Room</h1>
<table>
<thead>
<tr>
<th></th>
<th>Firebase Firestore</th>
<th>OkHttp (REST)</th>
<th>Room (SQLite)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Localização</td>
<td>cloud (Google)</td>
<td>servidor externo</td>
<td>dispositivo</td>
</tr>
<tr>
<td>Sincronização</td>
<td>tempo real</td>
<td>manual (pull)</td>
<td>local only</td>
</tr>
<tr>
<td>Autenticação</td>
<td>integrada (Auth)</td>
<td>manual (tokens)</td>
<td>N/A</td>
</tr>
<tr>
<td>Offline</td>
<td>cache automático</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td>Exemplo</td>
<td>ShoppingList</td>
<td>DailyNews</td>
<td>DailyNews bookmarks</td>
</tr>
</tbody>
</table>
<p>Escolher conforme o caso: <strong>Firebase</strong> para dados partilhados na cloud com sync; <strong>Room</strong> para cache offline; <strong>OkHttp</strong> para APIs REST públicas.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="215" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="215" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="firebase--resumo">Firebase — resumo</h1>
<table>
<thead>
<tr>
<th>Serviço</th>
<th>API Kotlin</th>
<th>Função</th>
</tr>
</thead>
<tbody>
<tr>
<td>Auth</td>
<td><code>Firebase.auth</code></td>
<td>login, <code>currentUser?.uid</code></td>
</tr>
<tr>
<td>Firestore</td>
<td><code>Firebase.firestore</code></td>
<td>CRUD na cloud</td>
</tr>
<tr>
<td>Analytics</td>
<td>automático</td>
<td>estatísticas de uso</td>
</tr>
<tr>
<td>FCM</td>
<td><code>FirebaseMessaging</code></td>
<td>push notifications</td>
</tr>
</tbody>
</table>
<p>Regras:</p>
<ul>
<li>Configurar <strong><code>google-services.json</code></strong> e plugin no Gradle</li>
<li>Definir <strong>Security Rules</strong> na consola Firebase (quem pode ler/escrever)</li>
<li>Listeners Firestore na <strong>background</strong> — actualizam UI via ViewModel</li>
<li>Nunca expor chaves secretas no código — Auth gere tokens</li>
</ul>
<p>Próximo passo: <strong>Clean Architecture</strong> + <strong>Repository</strong> com Firebase e Room.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="216" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="216" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="clean-architecture">Clean Architecture</h1>
<p>Padrão que organiza o código em <strong>camadas</strong> com responsabilidades claras:</p>
<ul>
<li>Cada camada só conhece a camada <strong>imediatamente abaixo</strong></li>
<li>Lógica de negócio <strong>independente</strong> da UI e da base de dados</li>
<li>Fácil de <strong>testar</strong>, <strong>manter</strong> e <strong>substituir</strong> implementações</li>
</ul>
<p>Na <strong>ShoppingList</strong>, a estrutura simplificada:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Presentation  →  ViewModel  →  Repository  →  Firebase
  (Compose UI)     (estado)      (dados)         (fonte)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="217" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="217" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="clean-architecture--camadas">Clean Architecture — camadas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>┌─────────────────────────────────────────────────────┐
│              Presentation (UI)                       │
│   HomeView · LoginView · ProductsView               │
└────────────────────────┬────────────────────────────┘
                         │ observa estado / chama métodos
                         ▼
┌─────────────────────────────────────────────────────┐
│              ViewModel                               │
│   HomeViewModel · LoginViewModel                    │
└────────────────────────┬────────────────────────────┘
                         │ usa Repository (interface/concrete)
                         ▼
┌─────────────────────────────────────────────────────┐
│              Repository (Data)                       │
│   CartRepository                                    │
└────────────────────────┬────────────────────────────┘
                         │ acede Firebase / Room / API
                         ▼
┌─────────────────────────────────────────────────────┐
│              Data Source                             │
│   Firestore · Firebase Auth                         │
└─────────────────────────────────────────────────────┘
</code></pre>
<p>A UI <strong>nunca</strong> chama Firestore directamente.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="218" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="218" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="shoppinglist--estrutura-de-pastas">ShoppingList — estrutura de pastas</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>ipca.example.shoppinglist/
├── ShoppingListApp.kt          @HiltAndroidApp
├── AppModule.kt                módulo Hilt (provides)
├── MainActivity.kt             @AndroidEntryPoint
├── models/
│   ├── Cart.kt
│   └── Product.kt
├── repository/
│   ├── CartRepository.kt
│   ├── ResultWrapper.kt
│   └── RepositoryHelpers.kt
└── ui/
    ├── home/    HomeView + HomeViewModel
    ├── login/   LoginView + LoginViewModel
    └── products/ ProductsView + ProductsViewModel
</code></pre>
<p>Separação clara: <strong>UI</strong>, <strong>lógica</strong>, <strong>dados</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="219" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="219" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="sem-vs-com-clean-architecture">Sem vs Com Clean Architecture</h1>
<p><strong>Sem</strong> — ViewModel acede Firebase directamente:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  HomeViewModel  ──►  Firebase.firestore  (acoplamento forte)
</code></pre>
<p><strong>Com</strong> — ViewModel usa Repository:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  HomeViewModel  ──►  CartRepository  ──►  FirebaseFirestore
</code></pre>
<p>Benefícios:</p>
<ul>
<li>Trocar Firebase por Room <strong>sem alterar</strong> o ViewModel</li>
<li>Testar ViewModel com <strong>Repository fake</strong></li>
<li>Código reutilizável e legível</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="220" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="220" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="repository--cartrepository">Repository — CartRepository</h1>
<p>Encapsula <strong>como</strong> obter e guardar dados:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">CartRepository</span> <span class="hljs-meta">@Inject</span> <span class="hljs-keyword">constructor</span>(
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">val</span> db: FirebaseFirestore
) {
    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">fetchCarts</span><span class="hljs-params">()</span></span>: Flow&lt;ResultWrapper&lt;List&lt;Cart&gt;&gt;&gt; = flow {
        emit(ResultWrapper.Loading())
        <span class="hljs-keyword">val</span> query = db.collection(<span class="hljs-string">&quot;carts&quot;</span>)
            .whereArrayContains(<span class="hljs-string">&quot;owners&quot;</span>, Firebase.auth.currentUser?.uid!!)
        query.snapshotFlow().collect { snapshot -&gt;
            <span class="hljs-keyword">val</span> carts = <span class="hljs-comment">/* parse documents */</span>
            emit(ResultWrapper.Success(carts))
        }
    }.flowOn(Dispatchers.IO)

    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">createCart</span><span class="hljs-params">(cart: <span class="hljs-type">Cart</span>)</span></span>: Flow&lt;ResultWrapper&lt;<span class="hljs-built_in">Unit</span>&gt;&gt; = flow { <span class="hljs-comment">/* ... */</span> }
}
</code></pre>
<p>O ViewModel <strong>não sabe</strong> que os dados vêm do Firestore.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="221" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="221" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="resultwrapper--estados-uniformes">ResultWrapper — estados uniformes</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">sealed</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">ResultWrapper</span>&lt;<span class="hljs-type">T</span>&gt;(<span class="hljs-keyword">val</span> <span class="hljs-keyword">data</span>: T? = <span class="hljs-literal">null</span>, <span class="hljs-keyword">val</span> message: String? = <span class="hljs-literal">null</span>) {
    <span class="hljs-keyword">class</span> <span class="hljs-title class_">Success</span>&lt;<span class="hljs-type">T</span>&gt;(<span class="hljs-keyword">data</span>: T) : ResultWrapper&lt;T&gt;(<span class="hljs-keyword">data</span>)
    <span class="hljs-keyword">class</span> <span class="hljs-title class_">Error</span>&lt;<span class="hljs-type">T</span>&gt;(message: String, <span class="hljs-keyword">data</span>: T? = <span class="hljs-literal">null</span>) : ResultWrapper&lt;T&gt;(<span class="hljs-keyword">data</span>, message)
    <span class="hljs-keyword">class</span> <span class="hljs-title class_">Loading</span>&lt;<span class="hljs-type">T</span>&gt;(<span class="hljs-keyword">data</span>: T? = <span class="hljs-literal">null</span>) : ResultWrapper&lt;T&gt;(<span class="hljs-keyword">data</span>)
}
</code></pre>
<p>O ViewModel trata todos os resultados da mesma forma:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin">cartRepository.fetchCarts().onEach { result -&gt;
    <span class="hljs-keyword">when</span> (result) {
        <span class="hljs-keyword">is</span> ResultWrapper.Success -&gt; uiState.value = uiState.value.copy(carts = result.<span class="hljs-keyword">data</span> ?: emptyList())
        <span class="hljs-keyword">is</span> ResultWrapper.Loading -&gt; uiState.value = uiState.value.copy(isLoading = <span class="hljs-literal">true</span>)
        <span class="hljs-keyword">is</span> ResultWrapper.Error   -&gt; uiState.value = uiState.value.copy(error = result.message)
    }
}.launchIn(viewModelScope)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="222" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="222" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="homeviewmodel--camada-de-apresenta%C3%A7%C3%A3o">HomeViewModel — camada de apresentação</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@HiltViewModel</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">HomeViewModel</span> <span class="hljs-meta">@Inject</span> <span class="hljs-keyword">constructor</span>(
    <span class="hljs-keyword">val</span> cartRepository: CartRepository   <span class="hljs-comment">// injetado pelo Hilt</span>
) : ViewModel() {

    <span class="hljs-keyword">var</span> uiState = mutableStateOf(HomeViewState())
        <span class="hljs-keyword">private</span> <span class="hljs-keyword">set</span>

    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">fetchCarts</span><span class="hljs-params">()</span></span> {
        cartRepository.fetchCarts().onEach { <span class="hljs-comment">/* when(result) */</span> }
            .launchIn(viewModelScope)
    }

    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">createCart</span><span class="hljs-params">()</span></span> {
        <span class="hljs-keyword">val</span> cart = Cart(name = <span class="hljs-string">&quot;New cart ...&quot;</span>, owners = listOf(uid))
        cartRepository.createCart(cart).onEach { <span class="hljs-comment">/* when(result) */</span> }
            .launchIn(viewModelScope)
    }
}
</code></pre>
<p><code>@Inject constructor</code> — Hilt <strong>fornece</strong> o <code>CartRepository</code> automaticamente.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="223" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="223" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="dagger-hilt--o-que-%C3%A9">Dagger Hilt — o que é?</h1>
<p><strong>Injeção de Dependências (DI)</strong> — o framework <strong>cria e liga</strong> objectos por nós:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  Sem DI:  ViewModel cria CartRepository cria FirebaseFirestore
  Com DI:  Hilt injecta CartRepository no ViewModel
           Hilt injecta FirebaseFirestore no CartRepository
</code></pre>
<p><strong>Dagger Hilt</strong> — DI oficial para Android, integrado com:</p>
<ul>
<li><code>ViewModel</code> (<code>@HiltViewModel</code>)</li>
<li><code>Activity</code> (<code>@AndroidEntryPoint</code>)</li>
<li>Compose (<code>hiltViewModel()</code>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="224" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="224" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="hilt--configura%C3%A7%C3%A3o-gradle">Hilt — configuração Gradle</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-comment">// build.gradle.kts (app)</span>
plugins {
    id(<span class="hljs-string">&quot;com.google.dagger.hilt.android&quot;</span>)
    id(<span class="hljs-string">&quot;com.google.devtools.ksp&quot;</span>)
}

dependencies {
    implementation(<span class="hljs-string">&quot;com.google.dagger:hilt-android:2.57.2&quot;</span>)
    ksp(<span class="hljs-string">&quot;com.google.dagger:hilt-android-compiler:2.57.2&quot;</span>)
    implementation(<span class="hljs-string">&quot;androidx.hilt:hilt-navigation-compose:1.3.0&quot;</span>)
}
</code></pre>
<p>KSP gera código de injeção em <strong>compile time</strong> — erros detectados cedo.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="225" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="225" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="hiltandroidapp">@HiltAndroidApp</h1>
<p>Classe <code>Application</code> anotada — ponto de entrada do Hilt:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@HiltAndroidApp</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">ShoppingListApp</span> : <span class="hljs-type">Application</span>()
</code></pre>
<p><code>AndroidManifest.xml</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">application</span> <span class="hljs-attr">android:name</span>=<span class="hljs-string">&quot;.ShoppingListApp&quot;</span> <span class="hljs-attr">...</span> &gt;</span>
</code></pre>
<p>Hilt inicializa o <strong>grafo de dependências</strong> quando a app arranca.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="226" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="226" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="appmodule--fornecer-depend%C3%AAncias">AppModule — fornecer dependências</h1>
<p>Quando Hilt não sabe como criar um objecto, usamos <code>@Module</code> + <code>@Provides</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Module</span>
<span class="hljs-meta">@InstallIn(SingletonComponent::class)</span>
<span class="hljs-keyword">object</span> AppModule {

    <span class="hljs-meta">@Provides</span>
    <span class="hljs-meta">@Singleton</span>
    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">firestore</span><span class="hljs-params">()</span></span>: FirebaseFirestore = Firebase.firestore

    <span class="hljs-meta">@Provides</span>
    <span class="hljs-meta">@Singleton</span>
    <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">auth</span><span class="hljs-params">()</span></span>: FirebaseAuth = Firebase.auth
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  AppModule
     │
     ├── @Provides firestore()  ──►  FirebaseFirestore
     └── @Provides auth()       ──►  FirebaseAuth
              │
              └── injectado em CartRepository(db)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="227" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="227" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="inject--injec%C3%A7%C3%A3o-autom%C3%A1tica">@Inject — injecção automática</h1>
<p>Classes com <code>@Inject constructor</code> são criadas pelo Hilt:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-keyword">class</span> <span class="hljs-title class_">CartRepository</span> <span class="hljs-meta">@Inject</span> <span class="hljs-keyword">constructor</span>(
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">val</span> db: FirebaseFirestore   <span class="hljs-comment">// vem do AppModule</span>
)
</code></pre>
<p>Hilt resolve a cadeia:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  HomeViewModel precisa de CartRepository
       └── CartRepository precisa de FirebaseFirestore
              └── AppModule.firestore() fornece FirebaseFirestore
</code></pre>
<p>Não escrevemos <code>CartRepository(Firebase.firestore)</code> manualmente.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="228" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="228" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="hiltviewmodel--hiltviewmodel">@HiltViewModel + hiltViewModel()</h1>
<p><strong>ViewModel</strong> anotado:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@HiltViewModel</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">HomeViewModel</span> <span class="hljs-meta">@Inject</span> <span class="hljs-keyword">constructor</span>(
    <span class="hljs-keyword">val</span> cartRepository: CartRepository
) : ViewModel()
</code></pre>
<p><strong>Compose</strong> obtém instância injectada:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@Composable</span>
<span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">HomeView</span><span class="hljs-params">(navController: <span class="hljs-type">NavController</span>)</span></span> {
    <span class="hljs-keyword">val</span> viewModel: HomeViewModel = hiltViewModel()
    <span class="hljs-keyword">val</span> uiState <span class="hljs-keyword">by</span> viewModel.uiState

    LaunchedEffect(<span class="hljs-built_in">Unit</span>) { viewModel.fetchCarts() }
    <span class="hljs-comment">// UI...</span>
}
</code></pre>
<p><code>hiltViewModel()</code> vs <code>viewModel()</code> — só o primeiro injecta dependências Hilt.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="229" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="229" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="androidentrypoint">@AndroidEntryPoint</h1>
<p>Activities e Fragments que usam injecção precisam da anotação:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-kotlin"><span class="hljs-meta">@AndroidEntryPoint</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">MainActivity</span> : <span class="hljs-type">ComponentActivity</span>() {
    <span class="hljs-keyword">override</span> <span class="hljs-function"><span class="hljs-keyword">fun</span> <span class="hljs-title">onCreate</span><span class="hljs-params">(savedInstanceState: <span class="hljs-type">Bundle</span>?)</span></span> {
        <span class="hljs-keyword">super</span>.onCreate(savedInstanceState)
        setContent { <span class="hljs-comment">/* NavHost com HomeView, LoginView, ... */</span> }
    }
}
</code></pre>
<p>Resumo das anotações Hilt:</p>
<table>
<thead>
<tr>
<th>Anotação</th>
<th>Onde</th>
<th>Função</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>@HiltAndroidApp</code></td>
<td>Application</td>
<td>inicia Hilt</td>
</tr>
<tr>
<td><code>@AndroidEntryPoint</code></td>
<td>Activity / Fragment</td>
<td>permite injecção</td>
</tr>
<tr>
<td><code>@HiltViewModel</code></td>
<td>ViewModel</td>
<td>injecta no ViewModel</td>
</tr>
<tr>
<td><code>@Inject constructor</code></td>
<td>Repository, etc.</td>
<td>pede dependências</td>
</tr>
<tr>
<td><code>@Module</code> + <code>@Provides</code></td>
<td>AppModule</td>
<td>define como criar objectos</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="230" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="230" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="fluxo-completo-shoppinglist">Fluxo completo ShoppingList</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>  HomeView
     │  hiltViewModel()
     ▼
  HomeViewModel  (@HiltViewModel + @Inject CartRepository)
     │  fetchCarts()
     ▼
  CartRepository  (@Inject FirebaseFirestore)
     │  snapshotFlow()
     ▼
  Firestore (cloud)
     │
     ▼  ResultWrapper&lt;List&lt;Cart&gt;&gt;
  HomeViewModel  →  uiState  →  HomeView recomposes
</code></pre>
<p>Hilt gere toda a <strong>criação de objectos</strong> — nós definimos apenas <strong>quem precisa de quem</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="231" data-paginate="true" data-class="lead" data-theme="h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb" lang="C" class="lead" data-marpit-pagination="231" style="--paginate:true;--class:lead;--theme:h7yxl0rglqb7kdmmasvv2taskm4uuwl9tairhmjoyb;" data-marpit-pagination-total="231">
<h1 id="clean-architecture--hilt--resumo">Clean Architecture + Hilt — resumo</h1>
<table>
<thead>
<tr>
<th>Camada</th>
<th>ShoppingList</th>
<th>Responsabilidade</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>View</strong></td>
<td><code>HomeView</code></td>
<td>UI Compose, eventos</td>
</tr>
<tr>
<td><strong>ViewModel</strong></td>
<td><code>HomeViewModel</code></td>
<td>estado, chama Repository</td>
</tr>
<tr>
<td><strong>Repository</strong></td>
<td><code>CartRepository</code></td>
<td>fonte de dados, mapeamento</td>
</tr>
<tr>
<td><strong>Model</strong></td>
<td><code>Cart</code>, <code>Product</code></td>
<td>classes de dados</td>
</tr>
<tr>
<td><strong>DI (Hilt)</strong></td>
<td><code>AppModule</code></td>
<td>liga dependências</td>
</tr>
</tbody>
</table>
<p>Princípios:</p>
<ul>
<li><strong>Single Responsibility</strong> — cada classe uma função</li>
<li><strong>Dependency Inversion</strong> — ViewModel depende de Repository, não de Firebase</li>
<li><strong>Testabilidade</strong> — injectar mocks via Hilt em testes</li>
</ul>
<p>Próximo passo: <strong>Use Cases</strong> (camada Domain) para lógica de negócio mais complexa.</p>
